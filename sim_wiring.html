<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>接线模拟 · 日光灯电路</title>
<style>
:root{--c1:#4f7df9;--ok:#22c55e;--err:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#eef1f6;color:#222;padding-bottom:20px;}
.hd{background:linear-gradient(135deg,var(--c1),#8b5cf6);color:#fff;padding:16px;display:flex;align-items:center;gap:10px;}
.hd b{font-size:17px;}
.hd .back{cursor:pointer;font-size:14px;opacity:.9;}
.info{margin:12px;padding:12px 14px;background:#fff;border-radius:12px;font-size:13px;line-height:1.7;box-shadow:0 2px 6px rgba(0,0,0,.05);}
.info b{color:var(--c1);}
.stage{position:relative;margin:0 12px;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;}
svg{display:block;width:100%;touch-action:none;}
/* terminal dots */
.term{cursor:pointer;}
.term circle.dot{fill:#fff;stroke:#334;stroke-width:2.5;transition:.15s;}
.term.hot circle.dot{fill:#fbbf24;stroke:#b45309;}
.term.live circle.dot{fill:#ef4444;stroke:#991b1b;}
.term.connected circle.dot{fill:#22c55e;stroke:#166534;}
/* wires */
.wire{stroke:#64748b;stroke-width:3;fill:none;stroke-linecap:round;pointer-events:none;}
.wire.ok{stroke:#22c55e;}
.wire.wrong{stroke:#ef4444;stroke-dasharray:6 4;}
.wire.ghost{stroke:#94a3b8;stroke-width:2;stroke-dasharray:5 5;}
/* component states */
.comp-on{filter:drop-shadow(0 0 6px #fbbf24);}
.result{margin:12px;padding:14px;border-radius:12px;font-size:14px;line-height:1.8;display:none;}
.result.good{background:#dcfce7;color:#166534;display:block;}
.result.bad{background:#fee2e2;color:#991b1b;display:block;}
.btns{display:flex;gap:10px;margin:0 12px;}
.btns button{flex:1;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:600;}
#btn-power{background:var(--ok);color:#fff;}
#btn-clear{background:#e5e7eb;}
#btn-help{background:#dbeafe;color:#1e40af;}
.legend{margin:10px 12px;font-size:12px;color:#666;line-height:1.8;}
.lamp-glow{animation:lamp 1.2s infinite alternate;}
@keyframes lamp{from{opacity:.5}to{opacity:1}}
</style>
</head>
<body>
<div class="hd"><span class="back" onclick="location='index.html'">←</span><b>接线模拟：日光灯电路（K31-02）</b></div>
<div class="info">
<b>任务：</b>把元件端子连成正确电路 → 点【送电】判定。<br>
要求：相线 L 先进开关，开关控制镇流器；日光灯管与镇流器串联；启辉器并联在灯管两端；金属外壳接 PE。漏保 QF 合闸后灯亮才算合格。
</div>
<div class="stage">
<svg id="svg" viewBox="0 0 760 560">
  <!-- power source -->
  <g font-size="13">
    <text x="30" y="40" fill="#b91c1c" font-weight="bold">L 相线</text>
    <text x="30" y="90" fill="#1d4ed8" font-weight="bold">N 零线</text>
    <text x="30" y="140" fill="#16a34a" font-weight="bold">PE 地线</text>
  </g>
  <!-- QF breaker -->
  <g id="qf">
    <rect x="120" y="20" width="90" height="140" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="165" y="42" text-anchor="middle" font-size="13" fill="#334">QF 漏保</text>
    <line x1="140" y1="60" x2="190" y2="60" stroke="#334" stroke-width="2" id="qf-sw" transform="rotate(25 140 60)"/>
    <circle class="term" data-id="qf_l_in" cx="120" cy="60" r="9"><circle class="dot" r="6"/></circle>
    <circle class="term" data-id="qf_n_in" cx="120" cy="95" r="9"><circle class="dot" r="6"/></circle>
    <circle class="term" data-id="qf_l_out" cx="210" cy="60" r="9"><circle class="dot" r="6"/></circle>
    <circle class="term" data-id="qf_n_out" cx="210" cy="95" r="9"><circle class="dot" r="6"/></circle>
  </g>
  <!-- switch -->
  <g id="sw">
    <rect x="300" y="20" width="80" height="100" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="340" y="40" text-anchor="middle" font-size="13" fill="#334">开关 S</text>
    <line x1="318" y1="70" x2="362" y2="70" stroke="#334" stroke-width="2" id="sw-sw" transform="rotate(25 318 70)"/>
    <circle class="term" data-id="sw_in" cx="300" cy="70" r="9"><circle class="dot" r="6"/></circle>
    <circle class="term" data-id="sw_out" cx="380" cy="70" r="9"><circle class="dot" r="6"/></circle>
  </g>
  <!-- ballast 镇流器 -->
  <g id="bl">
    <rect x="500" y="20" width="120" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="560" y="62" text-anchor="middle" font-size="15" fill="#334">镇流器</text>
    <circle class="term" data-id="bl_in" cx="500" cy="55" r="9"><circle class="dot" r="6"/></circle>
    <circle class="term" data-id="bl_out" cx="620" cy="55" r="9"><circle class="dot" r="6"/></circle>
  </g>
  <!-- lamp tube -->
  <g id="lamp">
    <rect x="480" y="180" width="160" height="26" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="560" y="198" text-anchor="middle" font-size="14" fill="#854d0e">日光灯管</text>
    <circle class="term" data-id="lamp_l" cx="480" cy="193" r="9"><circle class="dot" r="6"/></circle>
    <circle class="term" data-id="lamp_r" cx="640" cy="193" r="9"><circle class="dot" r="6"/></circle>
  </g>
  <!-- starter 启辉器 -->
  <g id="st">
    <rect x="540" y="260" width="44" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="562" y="322" text-anchor="middle" font-size="12" fill="#334">启辉器</text>
    <circle class="term" data-id="st_a" cx="562" cy="260" r="9"><circle class="dot" r="6"/></circle>
    <circle class="term" data-id="st_b" cx="562" cy="304" r="9"><circle class="dot" r="6"/></circle>
  </g>
  <!-- lamp holder 灯座 -->
  <g>
    <rect x="300" y="180" width="100" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="350" y="216" text-anchor="middle" font-size="13" fill="#334">灯座</text>
    <circle class="term" data-id="hold_a" cx="300" cy="210" r="9"><circle class="dot" r="6"/></circle>
    <circle class="term" data-id="hold_b" cx="400" cy="210" r="9"><circle class="dot" r="6"/></circle>
  </g>
  <!-- outlet 插座 -->
  <g>
    <rect x="300" y="320" width="100" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="350" y="345" text-anchor="middle" font-size="13" fill="#334">三孔插座</text>
    <circle class="term" data-id="xs_l" cx="300" cy="370" r="9"><circle class="dot" r="6"/></circle>
    <circle class="term" data-id="xs_n" cx="350" cy="400" r="9"><circle class="dot" r="6"/></circle>
    <circle class="term" data-id="xs_pe" cx="400" cy="370" r="9"><circle class="dot" r="6"/></circle>
  </g>
  <!-- ground bar 接地排 -->
  <g>
    <rect x="140" y="330" width="60" height="110" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="170" y="322" text-anchor="middle" font-size="13" fill="#166534">接地排</text>
    <circle class="term" data-id="pe_bar" cx="170" cy="385" r="9"><circle class="dot" r="6"/></circle>
  </g>
  <!-- neutral bar 零排 -->
  <g>
    <rect x="140" y="470" width="60" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="170" y="464" text-anchor="middle" font-size="13" fill="#1e40af">零排</text>
    <circle class="term" data-id="n_bar" cx="170" cy="500" r="9"><circle class="dot" r="6"/></circle>
  </g>
  <!-- wires layer -->
  <g id="wires"></g>
</svg>
</div>
<div class="result" id="result"></div>
<div class="btns">
  <button id="btn-clear" onclick="clearWires()">拆线重来</button>
  <button id="btn-help" onclick="showAnswer()">看提示</button>
  <button id="btn-power" onclick="powerOn()">⚡ 送电</button>
</div>
<div class="legend">操作：先点一个端子，再点另一个端子自动连线；点错线点一下线可拆除。L→QF→开关→镇流器→灯管一端，灯管另一端↔启辉器↔零线。</div>
<script>
// expected connections: each pair must exist
const TARGET = [
  ["L_src","qf_l_in"],["N_src","qf_n_in"],           // mains to QF
  ["qf_l_out","sw_in"],                              // L through switch
  ["sw_out","bl_in"],                                // switch to ballast
  ["bl_out","lamp_l"],                               // ballast to lamp
  ["lamp_r","st_a"],["st_b","n_bar"],                // starter to N
  ["hold_a","lamp_l"],["hold_b","lamp_r"],           // holder parallels tube
  ["qf_n_out","n_bar"],
  ["xs_l","qf_l_out"],["xs_n","qf_n_out"],["xs_pe","pe_bar"],
  ["pe_bar","PE_src"]
];
const SRC = {L_src:[30,60],N_src:[30,110],PE_src:[30,160]};
const POS = {};
document.querySelectorAll('.term').forEach(t=>{
  const c=t.querySelector('.dot');
  const b=t.getBoundingClientRect(), s=document.getElementById('svg').getBoundingClientRect();
  // use data coords from svg attributes
  const cx=+t.getAttribute('cx'), cy=+t.getAttribute('cy');
  POS[t.dataset.id]=[cx,cy];
  t.addEventListener('click',()=>pickTerm(t.dataset.id));
});
// clickable source labels
document.querySelectorAll('text').forEach(tx=>{
  const map={'L 相线':'L_src','N 零线':'N_src','PE 地线':'PE_src'};
  if(map[tx.textContent]){
    tx.style.cursor='pointer';
    tx.addEventListener('click',()=>pickTerm(map[tx.textContent]));
  }
});

let sel=null, wires=[], lastResult=null;
function pickTerm(id){
  if(!sel){sel=id;mark();return;}
  if(sel===id){sel=null;mark();return;}
  addWire(sel,id);sel=null;mark();
}
function mark(){
  document.querySelectorAll('.term').forEach(t=>{
    t.classList.toggle('hot', t.dataset.id===sel || (SRC[t.dataset.id]&&sel===t.dataset.id));
  });
  if(sel&&SRC[sel]){
    const txs=document.querySelectorAll('text');
    txs.forEach(tx=>{if({'L 相线':'L_src','N 零线':'N_src','PE 地线':'PE_src'}[tx.textContent]===sel)tx.setAttribute('fill','#f59e0b');});
  }
}
function addWire(a,b){
  if(wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a)))return;
  const pa=POS[a]||SRC[a], pb=POS[b]||SRC[b];
  const el=document.createElementNS('http://www.w3.org/2000/svg','path');
  const mx=(pa[0]+pb[0])/2;
  el.setAttribute('d',`M${pa[0]},${pa[1]} C${mx},${pa[1]} ${mx},${pb[1]} ${pb[0]},${pb[1]}`);
  el.setAttribute('class','wire');
  el.addEventListener('click',e=>{
    if(e.target===el){
      wires=wires.filter(w=>w.el!==el);el.remove();
      e.stopPropagation();
    }
  });
  document.getElementById('wires').appendChild(el);
  wires.push({a:b==null?null:a,b:b,el});
  wires[wires.length-1]={a:a,b:b,el};
}
function has(a,b){return wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a));}
function clearWires(){wires.forEach(w=>w.el.remove());wires=[];document.getElementById('result').className='result';}
function showAnswer(){
  const r=document.getElementById('result');
  r.className='result';r.style.display='block';
  r.innerHTML='<b style="color:#1e40af">提示（按顺序）：L→QF进线；QF出线L→开关S；开关出线→镇流器；镇流器→灯管左端；灯管右端→启辉器；启辉器→零排；灯座两端并接灯管两端；QF零线出→零排；插座L接QF出线L、N接QF出线N、PE接接地排；接地排→PE。</b>';
}
function powerOn(){
  const r=document.getElementById('result');
  let ok=[],bad=[];
  TARGET.forEach(([a,b])=>{has(a,b)?ok.push([a,b]):bad.push([a,b]);});
  // extra wrong wires
  const extras=wires.filter(w=>!TARGET.some(([a,b])=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a)));
  // score like real exam: 每错一处扣分，短路类=安全不合格项
  let msg='';
  wires.forEach(w=>w.el.classList.remove('ok','wrong'));
  TARGET.forEach(([a,b])=>{if(has(a,b))markWire(a,b,'ok');});
  extras.forEach(w=>w.el.classList.add('wrong'));
  const score=Math.max(0,100-bad.length*8-extras.length*5);
  const pass=bad.length===0&&extras.length===0;
  r.style.display='block';
  r.className='result '+(pass?'good':'bad');
  if(pass){
    msg='✅ 送电成功！灯亮，全部接线正确。<br>评分：100 分（合格）。整理场地，考试完成！';
    document.getElementById('lamp').classList.add('comp-on');
    document.getElementById('lamp').querySelector('rect').setAttribute('fill','#fde047');
  }else{
    msg=`❌ 送电结果：<br>· 缺线 ${bad.length} 处：${bad.map(([a,b])=>a+'↔'+b).join('、')}<br>· 多余/错误线 ${extras.length} 处（红色虚线）<br>· 得分 ${score} 分（80 分合格），错 1 处扣 8 分<br>点红色虚线可拆掉重接。`;
    document.getElementById('lamp').classList.remove('comp-on');
    document.getElementById('lamp').querySelector('rect').setAttribute('fill','#fefce8');
  }
  r.innerHTML=msg;
}
function markWire(a,b,cls){
  const w=wires.find(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a));
  if(w)w.el.classList.add(cls);
}
</script>
</body>
</html>
