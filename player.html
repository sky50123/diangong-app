<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仿真 · 手机比例容器</title>
<style>
:root{--c1:#4f7df9;--c2:#8b5cf6;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#1a1f2b;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;}
/* phone frame */
.frame{position:relative;display:flex;flex-direction:column;align-items:center;}
.bezel{background:#0d1117;border-radius:36px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px #2a3040;}
.screen{width:390px;height:844px;border-radius:26px;overflow:hidden;background:#eef1f6;position:relative;}
.screen iframe{width:390px;height:844px;border:none;display:block;}
/* side controls */
.side{position:fixed;left:24px;top:50%;transform:translateY(-50%);background:#12161f;border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.4);}
.side h3{color:#8b93a5;font-size:12px;font-weight:600;margin-bottom:4px;letter-spacing:.05em;}
.side button{background:#1f2633;border:1px solid #2e3746;color:#d0d5de;padding:9px 12px;border-radius:10px;font-size:13px;cursor:pointer;text-align:left;transition:.15s;min-width:150px;}
.side button:hover{background:#273042;border-color:#3d4859;}
.side button.on{background:#4f7df9;border-color:#4f7df9;color:#fff;}
.side .url{margin-top:8px;background:#0d1117;border:1px solid #2e3746;border-radius:10px;color:#9aa3b2;font-size:11px;padding:8px 10px;word-break:break-all;max-width:170px;}
/* scale control */
.zoom{position:fixed;right:24px;top:50%;transform:translateY(-50%);background:#12161f;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4);}
.zoom .lbl{color:#8b93a5;font-size:11px;}
.zoom button{width:40px;height:40px;border-radius:50%;border:1px solid #2e3746;background:#1f2633;color:#fff;font-size:18px;cursor:pointer;}
.zoom button:hover{background:#273042;}
.zoom .val{color:#e8ecf3;font-size:15px;font-weight:700;}
.top{position:fixed;top:18px;left:50%;transform:translateX(-50%);color:#8b93a5;font-size:13px;background:#12161f;padding:8px 18px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.4);}
.top b{color:#e8ecf3;}
</style>
</head>
<body>
<div class="top">仿真运行器 · <b id="curPage">-</b> · 手机比例 390×844</div>

<div class="side">
  <h3>实训模块</h3>
  <button onclick="go('sims/k11-exam-bench-lv.html')">🧰 K11 仪表考位(低压)</button>
  <button onclick="go('sims/k11-exam-bench.html')">🧰 K11 仪表考位(高压)</button>
  <button onclick="go('sims/safety-tools-train.html')">⛑️ 安全用具训练</button>
  <button onclick="go('sims/safety-p2_lv_lv-safety-p2-universal.html')">⚠️ 科目二隐患(低压)</button>
  <button onclick="go('sims/safety-p2_hv_hv-safety-p2-universal.html')">⚠️ 科目二隐患(高压)</button>
  <button onclick="go('sims/safety-sign-quiz.html')">🚸 安全标志 quiz</button>
  <button onclick="go('sims/schematic-lv3-k31-01.html')">🏗️ K31-01 配电箱</button>

  <button onclick="go('sims/schematic-lv3-k31-03.html')">🌀 K31-03 三相连续</button>
  <button onclick="go('sims/schematic-lv3-k31-04.html')">🔀 K31-04 正反转</button>
  <button onclick="go('sims/schematic-lv3-k31-05.html')">⚙️ K31-05 星三角</button>
  <button onclick="go('sims/k32-maintenance.html')">🔧 K32 开关柜维护</button>
  <button onclick="go('sims/k33-01.html')">🏗️ K33 临时用电</button>
  <button onclick="go('sims/lv-sub3-oneline.html')">🖥️ 低压模拟屏</button>
  <button onclick="go('sims/digit-meter-lv.html')">🔎 数字万用表</button>

  <button onclick="go('sims/bandage-canvas.html')">🩹 包扎训练</button>

  <div class="url" id="urlBox">sims/</div>

<div class="frame">
  <div class="bezel">
    <div class="screen">
      <iframe id="f" src="sims/k11-exam-bench-lv.html" allow="fullscreen"></iframe>
    </div>
  </div>
</div>

<div class="zoom">
  <div class="lbl">缩放</div>
  <button onclick="zoom(-0.1)">−</button>
  <div class="val" id="zv">100%</div>
  <button onclick="zoom(0.1)">＋</button>
  <button onclick="zoom(0)" style="width:auto;padding:0 10px;height:30px;font-size:12px;border-radius:8px;">重置</button>
</div>

<script>
var scale = 1;
var frame = document.querySelector('.frame');
function applyZoom(){
  frame.style.transform = 'scale(' + scale + ')';
  document.getElementById('zv').textContent = Math.round(scale*100) + '%';
}
function zoom(d){
  scale = d === 0 ? 1 : Math.min(2, Math.max(0.4, scale + d));
  applyZoom();
}
function go(f){
  // QuickLook 兜底：iframe 没成功加载过 → 直接整页跳转（在预览里也能打开子页面）
  var fEl = document.getElementById('f');
  if (!fEl || !fEl.dataset.loaded) {
    try { location.href = f; } catch(e) {}
    document.getElementById('curPage').textContent = f;
    document.getElementById('urlBox').textContent = f;
    return;
  }
  fEl.src = f;
  document.getElementById('curPage').textContent = f;
  document.getElementById('urlBox').textContent = f;
  document.querySelectorAll('.side button').forEach(function(b){ b.classList.remove('on'); });
  if (event && event.target) event.target.classList.add('on');
}
// scroll wheel zoom on frame
document.addEventListener('wheel', function(e){
  if (e.ctrlKey) { e.preventDefault(); zoom(e.deltaY > 0 ? -0.05 : 0.05); }
}, {passive:false});
// keyboard: iframe needs focus for page interaction; hint
go('sims/k11-exam-bench-lv.html');
</script>
<div id="qlBanner" style="display:none;position:fixed;inset:0;z-index:9999;background:#12161f;color:#fff;padding:40px 24px;text-align:center;flex-direction:column;justify-content:center;gap:16px;">
  <div style="font-size:22px;font-weight:800;">检测到「文件」预览模式</div>
  <div style="font-size:14px;line-height:2;color:#9aa3b2;">
    iOS「文件」App 的预览不加载仿真内容。<br>
    请按下面步骤用 Safari 打开：
  </div>
  <div style="background:#1f2633;border-radius:14px;padding:18px;text-align:left;font-size:14px;line-height:2.2;">
    ① 点屏幕右上角 <b style="color:#4f7df9;">「完成」</b> 退出预览<br>
    ② 回到文件列表，长按 <b>player.html</b><br>
    ③ 选 <b style="color:#4f7df9;">「共享」</b>（分享图标）<br>
    ④ 在弹出的面板里选 <b style="color:#4f7df9;">Safari</b><br>
    &nbsp;&nbsp;&nbsp;（若没有 Safari，点「更多」启用）
  </div>
  <div style="font-size:12px;color:#6b7280;">之后可在此页面「添加到主屏幕」，像 App 一样使用</div>
</div>
<script>
(function(){
  // Quick Look 检测：QuickLook 沙箱里 iframe 加载子目录文件会失败
  function inQuickLook(){
    try {
      var f = document.getElementById('f');
      if (!f) return true;
      // QuickLook 下 iframe 的 contentDocument 访问会抛异常或为空
      var loaded = false;
      try {
        f.addEventListener('load', function(){ loaded = true; });
        // 已在页面加载后 3 秒仍未触发 load 则视为预览沙箱
      } catch(e){ return true; }
      return false;
    } catch(e){ return true; }
  }
  window.addEventListener('load', function(){
    setTimeout(function(){
      var f = document.getElementById('f');
      var bad = false;
      try {
        // 尝试访问 iframe 内部：QuickLook 会抛 SecurityError 或一直 about:blank
        var doc = f.contentDocument || f.contentWindow.document;
        if (!doc || doc.location.href === 'about:blank') bad = true;
      } catch(e) { bad = false; } // cross-origin file:// 也可能抛异常，但正常 Safari 允许同目录
      // 更可靠：检查 iframe 是否触发过 load 且渲染了标题
      if (!f.dataset.loaded) bad = true;
      if (bad) {
        var b = document.getElementById('qlBanner');
        if (b) b.style.display = 'flex';
      }
    }, 3000);
  });
  // 记录 iframe load
  document.addEventListener('DOMContentLoaded', function(){
    var f = document.getElementById('f');
    if (f) f.addEventListener('load', function(){ f.dataset.loaded = '1'; });
  });
})();
</script></body>
</html>
