<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K33-01 施工现场临时用电搭设</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#dcdcd6;color:#1c1c1a;font:13px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;max-width:540px;margin:0 auto;background:#eeeee9;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 18px 60px rgba(0,0,0,.12)}

/* 顶部 */
header{flex:none;background:#fff;border-bottom:1px solid #e2e2dc;padding:9px 12px 8px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hd .t{font-size:14px;font-weight:600;letter-spacing:.2px}
.hd .m{font-size:11px;color:#7a7a74;display:flex;gap:10px;white-space:nowrap}
.hd .m b{color:#1c1c1a;font-weight:600}
nav{display:flex;gap:4px}
nav button{flex:1;min-width:0;border:1px solid #ddd8cf;background:#faf9f6;border-radius:7px;padding:5px 1px;font-size:11px;color:#57574f;font-weight:500;overflow:hidden}
nav button.on{background:#1c1c1a;border-color:#1c1c1a;color:#fff}
nav button.lock{opacity:.42}
nav button.done:not(.on){border-color:#b9d8c2;background:#f2f9f4;color:#2c7a4b}
nav button .n{display:block;font-size:9px;opacity:.6;font-weight:400}
.navrow{display:flex;align-items:center;gap:8px;margin-top:7px}
.navrow nav{flex:1;margin-top:0}
.navrow .m{flex:none;font-size:10.5px;color:#7a7a74;display:flex;gap:8px;white-space:nowrap}
.navrow .m b{color:#1c1c1a;font-weight:600}
#boxnav{margin-top:6px}
#boxnav button{padding:4px 2px}

/* 舞台 */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#e7e7e1;touch-action:none}
#world{position:absolute;top:0;left:0;width:100%;display:block;will-change:transform}
#world.snap{transition:transform .42s cubic-bezier(.22,1,.36,1)}
.sep-t{font:600 26px/1 -apple-system,"PingFang SC",sans-serif;fill:#3a3a34}
.sep-s{font:400 19px/1 -apple-system,"PingFang SC",sans-serif;fill:#8a8a80}
/* 端子环：平时极淡，已接 / 亮选 才明显 */
.ring{transition:r .14s,stroke-width .14s,opacity .14s;opacity:.28}
.ring.on{opacity:1}
.ring.done{opacity:.95}
.halo{transition:opacity .14s;opacity:.5}
.halo.on{opacity:1}
.hit{cursor:pointer}
.lbl{font:500 15px/1 -apple-system,"PingFang SC",sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}

/* 检查圈 / 分闸圈（步骤 3 / 5 的亮圈热点） */
.ckspot{cursor:pointer;fill:none;stroke:#ffd23f;stroke-width:4.5;opacity:.92;pointer-events:all;animation:ckpulse 1.55s ease-in-out infinite}
@keyframes ckpulse{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}
.ckspot.done{stroke:#39a96b;animation:none;opacity:.95}
.ckspot.hide{display:none}
.tagtxt{font:700 17px/1.25 -apple-system,"PingFang SC",sans-serif;fill:#fff;pointer-events:none}
.isolab{font:600 15px/1 -apple-system,"PingFang SC",sans-serif;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px;pointer-events:none}

/* 安措步引导提示点：黄色编号徽标 + 白底说明牌（K32-01 同款思路：让用户一眼知道点哪儿、第几步） */
.shint{pointer-events:all;cursor:pointer;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.shint.hide{display:none}
.shint .pl{fill:#fff;stroke:#ffd23f;stroke-width:4}
.shint .pt{font:700 30px/1 -apple-system,"PingFang SC",sans-serif;fill:#1c1c1a}
.shint .bd{fill:#ffd23f;stroke:#1c1c1a;stroke-width:3.5}
.shint .bt{font:700 28px/1 -apple-system,"PingFang SC",sans-serif;fill:#1c1c1a}
.shint .ar{fill:#fff;stroke:#ffd23f;stroke-width:4;stroke-linejoin:round}
/* 步内进度条（①②③ 谁已完成、现在该做哪个） */
.safechips{position:absolute;left:10px;right:10px;top:8px;display:flex;gap:5px;justify-content:center;
  pointer-events:none;z-index:7;flex-wrap:wrap}
.safechips i{font-style:normal;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;
  background:rgba(255,255,255,.94);color:#8a8a80;border:1px solid rgba(0,0,0,.07);
  box-shadow:0 2px 7px rgba(0,0,0,.14);white-space:nowrap}
.safechips i.cur{background:#ffd23f;color:#1c1c1a;border-color:#e3b919;animation:chipPulse 1.4s ease-in-out infinite}
@keyframes chipPulse{0%,100%{box-shadow:0 2px 7px rgba(255,210,63,.5)}50%{box-shadow:0 2px 14px rgba(255,210,63,1)}}
.safechips i.ok{background:#39a96b;color:#fff;border-color:#2f8d59}
.safechips i.ok::after{content:" ✓"}
/* 三步做完后的去向提示：告诉用户点右下「下一步」 */
.safecta{position:absolute;right:12px;bottom:64px;z-index:9;border:0;background:#e8851a;color:#fff;
  font:600 11.5px/1 -apple-system,"PingFang SC",sans-serif;padding:9px 13px;border-radius:20px;
  box-shadow:0 6px 18px rgba(232,133,26,.5);animation:ctaBob 1.15s ease-in-out infinite}
.safecta::after{content:" ↓";font-size:14px}
@keyframes ctaBob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* 接线 · 两箱对望（试点：总箱 → 分箱） */
.stage.pairmode .tip{bottom:58px}
.wchips{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:5px;justify-content:center;
  z-index:9;flex-wrap:wrap}
.wchips button{font:600 10.5px/1 -apple-system,"PingFang SC",sans-serif;padding:5px 9px;border-radius:18px;
  border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.95);color:#5f5e5a;
  box-shadow:0 2px 7px rgba(0,0,0,.13);white-space:nowrap}
.wchips button.cur{background:#1c1c1a;border-color:#1c1c1a;color:#fff}
.wchips button.ok{background:#39a96b;border-color:#2f8d59;color:#fff}
.pw{position:absolute;inset:0;overflow:hidden;background:#e7e7e1}
.pw .bx{position:absolute;border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.pw .bxl{position:absolute;z-index:4;font:600 10.5px/1 -apple-system,"PingFang SC",sans-serif;
  color:#fff;background:rgba(28,28,26,.84);padding:4px 8px;border-radius:12px;white-space:nowrap}
.pw svg{position:absolute;left:0;top:0;pointer-events:none}
.pw .hn{position:absolute;z-index:6;border-radius:15px;border:2px solid rgba(255,255,255,.92);
  background:rgba(28,26,22,.84);color:#fff;padding:0;
  font:600 10.5px/1 -apple-system,"PingFang SC",sans-serif;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pw .hn.pend{background:#ffd23f;border-color:#fff;color:#1c1c1a;animation:psp 1.3s ease-in-out infinite}
.pw .hn.now{border-color:#fff;animation:psp 1.3s ease-in-out infinite}
.pw .hn.pend{border-color:#fff}
.pw .hn.on{background:#39a96b;border-color:#a8e6c1}
.pw .gd{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;background:rgba(28,28,26,.92);
  color:#f4f4f0;border-radius:9px;padding:8px 11px;font-size:11.5px;line-height:1.4;
  backdrop-filter:blur(6px)}
.pw .gd b{color:#ffd23f;font-weight:600}

/* 提示条 */
.tip{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(28,28,26,.88);color:#fff;border-radius:9px;padding:7px 11px;font-size:11.5px;backdrop-filter:blur(6px);pointer-events:none;opacity:0;transition:opacity .2s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.tip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* 底部工具 */
.tool{flex:none;background:#fff;border-top:1px solid #e2e2dc;padding:8px 10px 10px}
.lab{font-size:10.5px;color:#8d8d84;letter-spacing:.2px;margin:0 0 5px;line-height:1.4}
.lab b{color:#1c1c1a;font-weight:600}
.labrow{display:flex;align-items:center;gap:8px;margin:0 0 5px}
.labrow .lab{flex:1;margin:0;min-width:0}
.swap{flex:none;border:1px solid #ddd8cf;background:#faf9f6;border-radius:7px;padding:3px 11px;font-size:10.5px;color:#3a3a34;font-weight:600;white-space:nowrap}
.swap.on{background:#1c1c1a;border-color:#1c1c1a;color:#fff}
/* 线缆盘：浮在画面上（不再挤压舞台高度） */
.deck{display:flex;gap:7px;position:absolute;left:10px;right:10px;bottom:10px;z-index:8;
  background:#fff;border-radius:12px;padding:8px;box-shadow:0 10px 28px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.05)}
.deck .cable{flex:1;border:1.5px solid #e0ded6;background:#fff;border-radius:10px;padding:8px 4px 7px;text-align:center;position:relative;min-width:0}
.deck .cable.held{border-color:#1c1c1a;background:#f7f6f2;font-weight:600}
.deck .cable img{display:block;width:100%;height:54px;object-fit:cover;border-radius:7px;background:#fff}
.deck .cable .nm{font-size:11px;font-weight:600;color:#1c1c1a;margin-top:6px}
.deck .cable .sub{font-size:10px;color:#8d8d84;margin-top:2px}
/* 选缆步真选芯：每张卡下 3/4/5 三个芯数钮（PATCH-20261122-PICKCABLE） */
.deck .cable .pick{display:flex;gap:4px;margin-top:5px}
.deck .cable .pick button{flex:1;border:1.5px solid #ddd8cf;background:#faf9f6;border-radius:6px;
  padding:4px 0;font-size:11px;font-weight:600;color:#3a3a34;min-width:0}
.deck .cable .pick button.on{background:#1c1c1a;border-color:#1c1c1a;color:#fff}
.deck .cable .pick button:disabled{opacity:.55;cursor:default}
.deck .cable img.ph{display:flex;align-items:center;justify-content:center;background:#eceae2;
  color:#9a968a;font-size:11px;font-weight:600}
/* 选芯条：浮在画面上，不占舞台高度 */
.corebar{position:absolute;left:10px;right:10px;bottom:10px;z-index:8;display:none;
  flex-direction:column;gap:7px;background:rgba(28,28,26,.95);border-radius:11px;padding:9px 11px;
  box-shadow:0 10px 28px rgba(0,0,0,.3);backdrop-filter:blur(6px)}
.corebar.on{display:flex}
.corebar .q{font-size:11.5px;color:#f4f4f0;line-height:1.35}
.corebar .q b{font-weight:600}
.corebar .row{display:flex;gap:6px}
.corebar button{flex:1;border:1.5px solid #55554f;background:#2c2c2a;border-radius:7px;padding:5px 2px;font-size:11px;color:#f4f4f0;min-width:0}
.corebar button i{display:block;width:100%;height:5px;border-radius:2px;margin:0 auto 3px}
.stage.boxopen .tip{bottom:138px}
.stage.coreopen .tip{bottom:104px}
.acts{display:flex;gap:6px;margin-top:9px}
.acts button{flex:1;border:0;border-radius:8px;padding:9px 0;font-size:12.5px;font-weight:600}
.acts .go{background:#1c1c1a;color:#fff}
.acts .nx{background:#e8851a;color:#fff}
.acts .nx:disabled{opacity:.4}
.acts .rs{background:#f0efea;color:#4a4a44;flex:0 0 84px}
.hide{display:none !important}

/* 步骤表单 */
.form{max-height:34vh;overflow:auto;padding-right:3px}
.form .brief{background:#f4f3ee;border:1px solid #ddd8cf;border-radius:9px;padding:9px 11px;font-size:12px;color:#55534c;line-height:1.6;margin-bottom:8px}
.form .brief b{color:#1c1c1a}
.form::-webkit-scrollbar{width:3px}
.form::-webkit-scrollbar-thumb{background:#d5d3ca;border-radius:2px}
.hint{font-size:10.5px;line-height:1.5;color:#6a6a62;background:#f6f5f0;border-radius:7px;padding:6px 9px;margin-bottom:9px}
.fld{margin-bottom:9px}
.fld>.fl{font-size:10.5px;color:#8a8a82;margin-bottom:4px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid #e0ded6;background:#fff;border-radius:7px;padding:4px 9px;font-size:10.5px;color:#4a4a44;line-height:1.3}
.chips button.on{background:#1c1c1a;border-color:#1c1c1a;color:#fff;font-weight:600}
.odos{display:flex;flex-direction:column;gap:4px}
.odo{display:flex;align-items:center;gap:7px;border:1px solid #e8e6df;background:#fff;border-radius:7px;padding:5px 8px;font-size:10.5px;color:#4a4a44;text-align:left;line-height:1.35}
.odo .n{flex:none;width:16px;height:16px;border-radius:50%;background:#eeeee8;color:#9a9a92;font-size:9.5px;display:flex;align-items:center;justify-content:center;font-weight:700}
.odo.on{border-color:#1c1c1a;background:#f7f6f2;font-weight:600;color:#1c1c1a}
.odo.on .n{background:#1c1c1a;color:#fff}
.odo.ok{border-color:#39a96b;background:#f2f9f4}
.odo.ok .n{background:#39a96b;color:#fff}
.odo.lock{opacity:.45}
.seq{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.seq i{font-style:normal;font-size:10px;background:#eeeee8;border-radius:5px;padding:2px 6px;color:#5a5a52}

/* 结果层 */
.sheet{position:fixed;inset:0;background:rgba(20,20,18,.42);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet .in{background:#fff;width:100%;max-height:82%;border-radius:16px 16px 0 0;padding:16px 14px 20px;overflow:auto}
.sheet h3{font-size:15px;font-weight:600;margin-bottom:3px}
.sheet .sub{font-size:11.5px;color:#8a8a82;margin-bottom:12px}
.big{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px}
.big .n{font-size:40px;font-weight:700;line-height:1;letter-spacing:-1px}
.big .u{font-size:12px;color:#8a8a82;padding-bottom:4px}
.big .tag{margin-left:auto;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px}
.tag.ok{background:#e8f5ec;color:#1a7f45}
.tag.no{background:#fdeceb;color:#c0322a}
.grp{margin-top:12px}
.grp .h{font-size:11.5px;color:#8a8a82;margin-bottom:5px}
.it{display:flex;gap:7px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #f2f1ec;font-size:12px}
.it .k{flex:none;width:15px;font-weight:700}
.it .k.y{color:#1a7f45}
.it .k.n{color:#c0322a}
.it .d{flex:1;color:#3a3a34}
.it .s{flex:none;color:#a0a098;font-size:10.5px;padding-top:1px}
.it.bad .d{color:#c0322a}
.close{margin-top:16px;width:100%;border:0;border-radius:10px;background:#1c1c1a;color:#fff;padding:12px 0;font-size:13.5px;font-weight:600}
.view{flex:1;display:flex;flex-direction:column;min-height:0}

/* 首页穿戴门禁（硬前置） */
#ppeGate{position:fixed;inset:0;z-index:60;background:#20211f;color:#f4f4f0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
#ppeGate.off{display:none}
#ppeGate h2{font-size:20px;font-weight:600;letter-spacing:.4px;margin-bottom:5px}
#ppeGate .sub{font-size:12px;color:#a9aaa4;text-align:center;line-height:1.6;margin-bottom:18px}
#ppeGate .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:400px}
#ppeGate .card{position:relative;background:#2c2d2a;border:1px solid #454641;border-radius:12px;padding:12px 8px;text-align:center;user-select:none;cursor:pointer}
#ppeGate .card img{display:block;width:auto;height:auto;max-width:100%;max-height:104px;margin:0 auto 8px;object-fit:contain;background:#f2f2ee;border-radius:9px;padding:7px;box-sizing:border-box}
#ppeGate .card .nm{font-size:13px;font-weight:600}
#ppeGate .card .st{font-size:11px;color:#a9aaa4;margin-top:3px}
#ppeGate .card.done{border-color:#54b56c}
#ppeGate .card.done .st{color:#7bd995;font-weight:600}
#ppeGate .card.skip{opacity:.45;cursor:default}
#ppeGate .card.skip .st{color:#8f908a}
#ppeGate .card.done:after{content:"✓";position:absolute;top:7px;right:9px;width:21px;height:21px;line-height:21px;border-radius:50%;background:#3d9954;color:#fff;font-size:13px;font-weight:600}
#ppeGate .foot{display:flex;gap:10px;width:100%;max-width:400px;margin-top:18px}
#ppeGate .foot button{flex:1;border:0;border-radius:10px;padding:12px 0;font-size:13.5px;font-weight:600}
#ppeGate .foot .rs{background:#3a3b37;color:#d8d8d2;flex:0 0 92px}
#ppeGate .foot .go{background:#e8851a;color:#fff}
#ppeGate .foot .go:disabled{opacity:.4}
#ppeGate .note{font-size:11px;color:#8f908a;text-align:center;margin-top:12px;line-height:1.6}

/* 检查弹层选项 */
.ckgrp{margin-bottom:10px}
.ckgrp .t{font-size:12px;font-weight:600;color:#1c1c1a;margin-bottom:5px}

/* ===== K32式当前步条（不铺全部步骤） ===== */
.stepbar{display:flex;align-items:center;gap:7px;width:100%}
.stepbar .sb-n{flex:none;font-size:11px;font-weight:700;color:#e8851a;letter-spacing:.3px}
.stepbar .sb-t{flex:1;min-width:0;font-size:12px;font-weight:600;color:#1c1c1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepbar button{flex:none;border:1px solid #e0ded6;background:#fff;border-radius:7px;padding:4px 9px;font-size:11px;color:#4a4a44;cursor:pointer}
.stepbar button:disabled{opacity:.35}

/* ===== 实物操作台（覆盖舞台，点实物不点文字） ===== */
.propstage{position:absolute;inset:0;z-index:4;background:#e7e7e1;display:none;overflow:hidden}
.propstage.on{display:block}
#tip{z-index:9}
.ps-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ps-bg img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.14))}
.ps-tools{position:absolute;inset:52px 8px 12px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:6px}
.ps-tool{position:relative;border:1.5px solid #d7d7d0;background:#f0f0ec;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;cursor:pointer;overflow:hidden}
.ps-tool img{width:auto;height:auto;max-width:88%;max-height:74%;object-fit:contain}
.ps-tool b{font-size:10px;color:#34342f;line-height:1.2;text-align:center;margin-top:2px}
.ps-tool.on{border-color:#39a96b;background:#eaf7ef;box-shadow:inset 0 0 0 1px #39a96b}
.ps-tool.on:after{content:"✓";position:absolute;top:4px;right:5px;width:18px;height:18px;line-height:18px;border-radius:50%;background:#39a96b;color:#fff;font-size:11px;font-weight:700}
.ps-cap{position:absolute;left:10px;right:10px;top:8px;background:#f0f0ec;border:1px solid #d7d7d0;border-radius:9px;padding:6px 9px;font-size:11px;color:#55534c;line-height:1.45;z-index:3}
.ps-cap b{color:#1c1c1a}
/* 检测步手把手引导卡（PATCH-20261124-WIZARD）：当前项的所有子步骤列出来，做完打勾、当前步高亮 */
.pt-guide{background:#fff;border:1px solid #d7d7d0;border-radius:10px;margin:6px 8px 0;padding:7px 10px 8px;
  box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pt-guide .gh{display:flex;align-items:baseline;gap:7px;margin-bottom:5px}
.pt-guide .gh b{font:700 12px/1.3 -apple-system,"PingFang SC",sans-serif;color:#1c1c1a}
.pt-guide .gh span{font:400 10px/1.3 -apple-system,"PingFang SC",sans-serif;color:#8a887f;margin-left:auto}
.pt-guide .gs{display:flex;flex-direction:column;gap:3px}
.pt-guide .gi{display:flex;gap:7px;align-items:flex-start;font:400 11px/1.35 -apple-system,"PingFang SC",sans-serif;color:#a09e96}
.pt-guide .gi .n{flex:none;width:16px;height:16px;line-height:15px;text-align:center;border-radius:50%;
  border:1px solid #cdcbc4;font:700 9px/15px -apple-system,"PingFang SC",sans-serif;color:#a09e96}
.pt-guide .gi .t{padding-top:1px}
.pt-guide .gi.now{color:#1c1c1a;font-weight:600}

/* ===== 测量吸附点（PATCH-20261124-SNAP，用户 11-24 口径）=====
   用户口径：前面接线/检查步打大白圈点就行，但到了「实测」这一步不行——
   实测是鳄鱼夹/表笔去咬柜上的端子，要有吸附感，像模拟台那样"吸上去"，
   不能还是 40px 大白圈糊在端子上。
   做法：测点视觉缩到 18px（2px 细环 + 5px 芯点 + 慢呼吸晕），
   手指可点范围靠 6px 透明留边（30px）保底，笔尖/夹口进 28px 自动磁吸过去；
   夹上之后标记变淡、由夹子自己画的「钳口环」表示已咬住。 */
.ps-hot.tpt{padding:6px}
.ps-hot.tpt .cir{position:relative;width:18px;height:18px;line-height:1;border-width:2px;
  border-color:rgba(255,210,63,.95);background:rgba(255,255,255,.12);
  box-shadow:0 1px 3px rgba(0,0,0,.45),0 0 0 1px rgba(255,210,63,.12);
  animation:tptBreath 2.6s ease-in-out infinite}
.ps-hot.tpt .cir::after{content:'';position:absolute;left:50%;top:50%;width:5px;height:5px;
  margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#ffd23f;
  box-shadow:0 0 0 1.4px rgba(20,20,18,.62),0 0 4px rgba(255,210,63,.9)}
@keyframes tptBreath{0%,100%{box-shadow:0 1px 3px rgba(0,0,0,.45),0 0 0 1px rgba(255,210,63,.10)}
  50%{box-shadow:0 1px 3px rgba(0,0,0,.45),0 0 0 4px rgba(255,210,63,.22)}}
/* 本项要夹哪一支：黑夹的点画深色环、红夹的点画红色环，跟引导卡的①黑夹②红夹对得上 */
.ps-hot.tpt.tb .cir{border-color:rgba(38,38,42,.92)}
.ps-hot.tpt.tb .cir::after{background:#26262a;box-shadow:0 0 0 1.4px rgba(255,255,255,.82),0 0 4px rgba(0,0,0,.7)}
.ps-hot.tpt.tr .cir{border-color:rgba(224,53,43,.95)}
.ps-hot.tpt.tr .cir::after{background:#e0352b;box-shadow:0 0 0 1.4px rgba(255,255,255,.82),0 0 4px rgba(224,53,43,.7)}
/* 当前该操作的那个点：小圈轻轻跳一下（不再是大黄圈） */
.ps-hot.tpt.next .cir{animation:tptNext 1.5s ease-in-out infinite}
@keyframes tptNext{0%,100%{transform:scale(1);box-shadow:0 1px 3px rgba(0,0,0,.45),0 0 0 2px rgba(255,210,63,.18)}
  50%{transform:scale(1.24);box-shadow:0 1px 3px rgba(0,0,0,.45),0 0 0 6px rgba(255,210,63,.28)}}
/* 引导卡圈目标（guide-hi）在测点上也要收小；黑/红夹的颜色保留，只加呼吸光，别让"该夹哪一支"看丢 */
.ps-hot.tpt.guide-hi .cir{border-color:#e8a300 !important;animation:tptHint 1.4s ease-in-out infinite !important}
.ps-hot.tpt.tb.guide-hi .cir{border-color:rgba(38,38,42,.95) !important}
.ps-hot.tpt.tr.guide-hi .cir{border-color:rgba(224,53,43,.98) !important}
@keyframes tptHint{0%,100%{box-shadow:0 0 0 0 rgba(232,163,0,.68)}50%{box-shadow:0 0 0 5px rgba(232,163,0,.14)}}
/* 已被夹住的点：标记退到后面（夹子自己会画一圈钳口环），别跟夹子抢。
   注意要写在 .snapping 前面——拖拽途中笔尖已贴上端子时 taken 也会命中，
   顺序反了会把"吸亮放大"的反馈盖掉（试过，看不出吸住）。 */
.ps-hot.tpt.taken .cir{opacity:.42;transform:scale(.86);animation:none}
/* 拖到吸附范围：小圈瞬间吸亮 + 放大（"吸住了"的即时反馈）。
   外圈用 outline 画——border-color 会被 .tb/.tr 和 guide-hi 的 !important 占着，抢不过来。 */
.ps-hot.tpt.snapping .cir{opacity:1;transform:scale(1.55);border-color:#ff9e1b;animation:none;
  outline:2.5px solid rgba(255,158,27,.9);outline-offset:2px;
  box-shadow:0 0 0 4px rgba(255,158,27,.34),0 0 12px 3px rgba(255,158,27,.5)}
/* 松手吸上的那一下：从放大弹回小点 */
.ps-hot.tpt.pop .cir{animation:tptPop .34s cubic-bezier(.2,1.5,.4,1) 1}
@keyframes tptPop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.ps-hot.tpt .lb{position:absolute;left:50%;bottom:100%;margin:0 0 1px;transform:translateX(-50%);
  font-size:9px;padding:1px 4px;border-radius:4px;background:rgba(24,24,22,.86);color:#fff;max-width:64px}
.ps-hot.tpt.next .lb{background:#e8a300;color:#3a2b00}
/* 夹子咬住端子时那圈钳口环（画在夹子上面 z-index 9，随夹子颜色） */
.pt-svg.pt-rings{z-index:9}
.pt-svg .jaw{fill:none;stroke-linecap:round;opacity:.95}
/* 短接自检：不再单设靶点，两支表笔「笔尖互碰」即短接（PATCH-20261123-TIPJOIN）。
   碰上的那一刻在笔尖上方弹一个「短接」小牌，明确告诉已经接通。 */
.pt-join{position:absolute;z-index:9;transform:translate(-50%,-50%);pointer-events:none;
  background:#ffd23f;color:#3a2b00;font-size:9.5px;font-weight:700;letter-spacing:.5px;
  padding:1px 7px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.35);
  animation:joinpop .18s ease-out}
.pt-svg{position:absolute;inset:0;z-index:6;pointer-events:none}
.pt-svg .lead{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pt-svg .lead.edge{stroke:rgba(0,0,0,.46);stroke-width:3.2}
.pt-svg .lead.core{stroke-width:2.1}
.pt-svg .lead.core.red{stroke:#e0352b}
.pt-svg .lead.core.black{stroke:#26262a}
.pt-svg .lead.hi{stroke:rgba(255,255,255,.5);stroke-width:.75}
.pt-svg .tipdot{stroke:#fff;stroke-width:1.6}
/* 检查步（漏保部位）的圈仍用大白圈；实测步的吸附点用 .tpt，走上面那套小标记 */
.ps-hot.pt:not(.tpt) .cir{width:40px;height:40px;line-height:34px;font-size:13px;border-width:2.5px}
.ps-hot.pt:not(.tpt) .lb{position:absolute;top:44px;left:50%;transform:translateX(-50%);margin-top:0;font-size:9.5px;padding:2px 6px;max-width:76px}
.ps-hot.pt.tier-0 .lb{top:88px}
.ps-hot.pt.tier-2 .lb{top:44px}
.ps-hot.pt.tier-1 .lb{top:66px}
.ps-hot.pt:not(.tpt).next .cir{animation:psp 1.15s ease-in-out infinite;box-shadow:0 0 0 4px rgba(255,210,63,.45),0 3px 10px rgba(0,0,0,.25)}

/* 送电/停电：操作点直接圈在对应柜子的开关上（空心环，能看见里面的手柄）；「摘牌」这一项本身就是块牌子 */
.ps-hot.ord-ring .cir{background:transparent;border-width:3px;border-color:#ffcf2e;
  box-shadow:0 0 0 2px rgba(60,40,0,.45),0 0 14px 4px rgba(255,206,46,.8)}
.ps-hot.ord-ring.ord-next .cir{animation:psp 1.15s ease-in-out infinite}
/* 操作完成：绿勾（盖掉空心环的透明底） */
.ps-hot.ord-ring.done .cir{background:rgba(52,160,100,.92);border-color:#2c7d4d;color:#fff;
  font-size:15px;box-shadow:0 0 0 2px rgba(255,255,255,.75),0 2px 8px rgba(0,0,0,.25);animation:none}
/* 同一柜上还没轮到的动作：小虚线环，不挂文字，免得压住牌子 */
.ps-hot.ord-late{opacity:.8}
.ps-hot.ord-late .cir{width:26px;height:26px;border-width:2px;border-style:dashed;
  border-color:#ffcf2e;background:transparent;animation:none;
  box-shadow:0 0 0 1.5px rgba(60,40,0,.35),0 0 8px 2px rgba(255,206,46,.5)}
.ps-hot.ord-late .lb{display:none}
/* 全部做完：柜面上盖一枚完成章 */
.ord-fin{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:6;
  background:rgba(28,28,26,.88);color:#fff;border-radius:14px;padding:14px 22px;text-align:center;
  box-shadow:0 8px 22px rgba(0,0,0,.3)}
.ord-fin b{display:block;font-size:15px;letter-spacing:.5px}
.ord-fin i{display:block;margin-top:5px;font-size:11px;font-style:normal;color:#9fe0b6}
/* 「禁止合闸 有人工作」牌：红底白字 + 白色描边 + 挂绳，就挂在隔离开关手柄旁边 */
.ps-hot.ord-tag .cir,.ps-hot.ord-tag.lock .cir{
  width:50px;height:auto;line-height:1.26;padding:3px 4px;border-radius:4px;
  border:2px solid #fff;background:#d32b22;color:#fff;
  font-size:6.8px;font-weight:700;letter-spacing:0;animation:psp 1.5s ease-in-out infinite;
  box-shadow:0 2px 8px rgba(0,0,0,.4),0 0 0 3px rgba(255,210,63,.9)}
.ps-hot.ord-tag .lb{display:none}
.ps-hot.ord-tag::before{content:'';position:absolute;left:50%;bottom:100%;width:2px;height:13px;
  margin-left:-1px;background:#9a9a92;box-shadow:0 0 2px rgba(0,0,0,.35)}
