*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#1a252f;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.page{width:100%;height:100vh;position:relative;background:linear-gradient(180deg,#dfe7f8,#e8f0fb);overflow:hidden;max-width:500px;margin:0 auto;}

body.debug .meter-wrap{outline:3px dashed #f44}
body.debug .lcd{outline:2px dashed #f44}
body.debug .knob-wrap{outline:2px dashed #44f}
.nudge-panel{display:none;position:fixed;z-index:300;background:rgba(0,0,0,0.9);border-radius:8px;padding:5px;color:#fff;font-size:9px;font-family:monospace;top:4px;right:4px;width:250px;}
body.debug .nudge-panel{display:block}
.nudge-panel .nr{display:flex;align-items:center;gap:2px;margin:1px 0;flex-wrap:wrap}
.nudge-panel .nl{color:#aaa;width:24px;text-align:right;font-size:8px}
.nudge-panel .nv{color:#0f0;width:22px;text-align:center;font-size:8px}
.nudge-panel button{width:18px;height:18px;border:none;border-radius:3px;background:#333;color:#fff;font-size:11px;font-weight:bold;cursor:pointer;line-height:1}
.nudge-panel button:active{background:#555}
.nudge-panel .sec{color:#ff0;font-size:8px;width:28px;margin-right:4px}
.nudge-btn{display:none}
.nudge-btn.on{background:rgba(0,128,0,0.8)}

.info-panel{position:absolute;z-index:55;display:flex;flex-direction:column;gap:2px;}
.info-title{font-weight:700;font-size:16px;color:#333;}
.info-target{font-size:14px;color:#333;}
.info-target span{color:#1677ff;font-weight:600;}
.ctrl-panel{position:absolute;z-index:55;display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.ctrl-type{display:flex;align-items:center;gap:6px;}
.ctrl-type label{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:14px;color:#333;white-space:nowrap;}
.ctrl-type label input{display:none;}
.ctrl-input{display:flex;align-items:center;gap:4px;font-size:14px;color:#333;}

.meter-wrap{position:absolute;width:44%;max-width:200px;z-index:10}
.meter-wrap .mbg{width:100%;display:block;position:relative;pointer-events:none}
.lcd{position:absolute;top:11%;left:12%;width:78%;height:20%;z-index:15;padding:1px 3px;border-radius:3px;background:linear-gradient(to bottom,#ddeef4,#cee8f2);box-shadow:inset 0 0 6px #f3feff;display:flex;flex-direction:column}
.lcd-t{display:flex;justify-content:space-between;align-items:center;height:20%}
.lcd-ti{width:18%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lcd-ti img{max-width:100%;max-height:100%;object-fit:contain}
.lcd-m{position:absolute;top:22%;left:1px;bottom:22%;width:10%;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.lcd-mi{width:100%;height:40%;display:flex;align-items:center;justify-content:center}
.lcd-mi img{max-width:100%;max-height:100%;object-fit:contain}
.lcd-vw{flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
.lcd-v{font-family:'Digital7',monospace;font-size:42px;color:#1a4a2a;text-shadow:0 0 5px rgba(26,74,42,0.6);text-align:right;line-height:1;overflow:hidden;white-space:nowrap}
.lcd-b{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:9px;font-weight:700;color:#1a4a2a}

.knob-wrap{position:absolute;top:60%;left:51%;transform:translate(-50%,-50%);width:52%;z-index:20}
.knob-wrap img{width:100%;height:100%;object-fit:contain;transform-origin:center center}

.jack-item{position:absolute;z-index:15;display:flex;flex-direction:column;align-items:center;gap:1px}
.jack-d{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#222,#000);border:1.5px solid #556}
.jack-d.hl{border-color:#1677ff;box-shadow:0 0 10px rgba(22,119,255,0.7)}
.jack-d.con{border-color:#44aa44;box-shadow:0 0 8px rgba(68,170,68,0.5)}
.jack-l{color:#778;font-size:6px;text-align:center;margin-top:1px}

/* 测量点 */
.meas-point{position:absolute;z-index:25;display:flex;flex-direction:column;align-items:center;gap:4px;}
.meas-dot{width:28px;height:28px;border-radius:50%;border:3px solid #999;background:rgba(255,255,255,0.5);}
.meas-dot.hl{border-color:#ff4444;box-shadow:0 0 18px rgba(255,68,68,0.7);transform:scale(1.2);background:rgba(255,220,220,0.4);}
.meas-dot.con{border-color:#44aa44;box-shadow:0 0 12px rgba(68,170,68,0.5);background:rgba(220,255,220,0.3);}
.meas-lbl{font-size:10px;font-weight:600;color:#555;}
.meas-title{position:absolute;z-index:25;font-size:11px;font-weight:700;color:#333;}

.probe{position:absolute;z-index:35;pointer-events:auto;touch-action:none}
.probe img{display:block;pointer-events:none}

#cv{position:absolute;top:0;left:0;width:100%;height:100%;z-index:30;pointer-events:none}


/* 电压类型选择面板 */
	.sel-cb{width:16px;height:16px;border:2px solid #999;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
	.sel-cb.checked{background:#1677ff;border-color:#1677ff;}
	.sel-cb.checked:after{content:'✓';color:#fff;font-size:10px;font-weight:bold;}
	.ctrl-input .inp{width:70px;height:26px;border:1px solid #ccc;border-radius:4px;padding:2px 6px;font-size:12px;text-align:center;color:#333;}
	.ctrl-input .inp:focus{outline:none;border-color:#1677ff;}
	.ctrl-input .inp-unit{font-size:11px;color:#667a8a;}

.acts{position:absolute;bottom:10px;left:6%;right:6%;z-index:50;display:flex;gap:6px;justify-content:center}
.acts button{flex:1;max-width:100px;padding:8px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer}
.acts .pri{background:#1677ff;color:#fff}
.acts .sec{background:#fff;color:#333;border:1px solid #ddd}
.acts .pri:disabled{background:#ccc}

.toast{position:fixed;top:15%;left:50%;transform:translateX(-50%);z-index:200;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:600;color:#fff;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;white-space:pre-line}
.toast.show{opacity:1}
.toast.w{background:rgba(230,100,0,0.93)}
.toast.e{background:rgba(200,20,20,0.93)}
.toast.i{background:rgba(0,0,0,0.85)}
</style>

<script>
/* __BACKBTN__ : iframe 内的返回按钮，向父页面 postMessage */
(function(){
  'use strict';
  if (window.top === window.self) return;   /* 不在 iframe 里就不显示 */

    if (document.getElementById('__backFab')) return;
    var b = document.createElement('button');
    b.id = '__backFab';
    b.textContent = '‹ 返回';
    b.style.cssText = [
      'position:fixed','left:8px','top:8px','z-index:2147483000',
      'background:rgba(24,95,165,.92)','color:#fff','border:none','border-radius:16px',

      'box-shadow:0 2px 10px rgba(0,0,0,.28)','cursor:pointer','-webkit-tap-highlight-color:transparent'

    b.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      try { parent.postMessage({ __dshBack: true }, '*'); } catch(err){}
    });
    document.body.appendChild(b);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', install);
  } else {
    install();
  }
  /* 有些页面会重绘 body，兜住 */
  setTimeout(install, 1200);
})();
</script>
