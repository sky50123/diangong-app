<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K32-01 低压配电柜的运行维护</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#dcdcd6;color:#1c1c1a;font:13px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;max-width:540px;margin:0 auto;background:#eeeee9;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 18px 60px rgba(0,0,0,.12)}

/* 顶部 */
header{flex:none;background:#fff;border-bottom:1px solid #e2e2dc;padding:9px 12px 8px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hd .t{font-size:14px;font-weight:600;letter-spacing:.2px}
.hd .m{font-size:11px;color:#7a7a74;display:flex;gap:10px;white-space:nowrap}
.hd .m b{color:#1c1c1a;font-weight:600}
nav{display:flex;gap:6px;margin-top:7px}
nav button{flex:1;border:1px solid #ddd8cf;background:#faf9f6;border-radius:8px;padding:5px 2px;font-size:11.5px;color:#57574f;font-weight:500}
nav button.on{background:#1c1c1a;border-color:#1c1c1a;color:#fff}
nav button .n{display:block;font-size:9.5px;opacity:.6;font-weight:400}

/* 舞台 */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#e7e7e1;touch-action:none}
#world{position:absolute;top:0;left:0;width:100%;display:block;will-change:transform}
#world.snap{transition:transform .42s cubic-bezier(.22,1,.36,1)}
/* 一景一屏：world2 固定为世界尺寸(975×8700)，由 JS 用 transform 把「当前场景图框」铺满视口 */
#world2{position:absolute;top:0;left:0;width:975px;height:8700px;display:block;will-change:transform;transform-origin:0 0}
#world2.snap{transition:transform .38s cubic-bezier(.22,1,.36,1)}
/* 第 3 步巡检：柜体正面 ⇄ 背面翻面按钮（贴在实物图上的唯一控件，不在下方面板） */
.flipbtn{position:absolute;right:12px;top:12px;z-index:5;border-radius:999px;padding:9px 16px;
  font:700 13px/1 -apple-system,"PingFang SC",sans-serif;color:#f6f1e2;background:rgba(29,35,32,.88);
  border:1px solid rgba(216,194,106,.6);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.flipbtn:active{transform:scale(.97)}
.flipbtn.hide{display:none}
.sep-t{font:600 26px/1 -apple-system,"PingFang SC",sans-serif;fill:#3a3a34}
.sep-s{font:400 19px/1 -apple-system,"PingFang SC",sans-serif;fill:#8a8a80}
/* 端子环：平时极淡，选中线色 / 悬停 / 已接 才亮 */
.ring{transition:r .14s,stroke-width .14s,opacity .14s;opacity:.28}
.ring.on{opacity:1}
.ring.done{opacity:.95}
.halo{transition:opacity .14s;opacity:.5}
.halo.on{opacity:1}
.hit{cursor:pointer}
.lbl{font:500 15px/1 -apple-system,"PingFang SC",sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}

/* 提示条 */
.tip{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(28,28,26,.88);color:#fff;border-radius:9px;padding:7px 11px;font-size:11.5px;backdrop-filter:blur(6px);pointer-events:none;opacity:0;transition:opacity .2s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.tip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* 底部工具 */
.tool{flex:none;background:#fff;border-top:1px solid #e2e2dc;padding:8px 10px 10px}
.lab{font-size:10.5px;color:#9a9a92;letter-spacing:.4px;margin:0 0 5px}
.pal{display:flex;gap:5px}
.pal button{flex:1;border:1.5px solid #e0ded6;background:#fff;border-radius:8px;padding:6px 0 5px;font-size:10.5px;color:#4a4a44;line-height:1.25;position:relative}
.pal button i{display:block;width:100%;height:4px;border-radius:2px;margin-bottom:4px}
.pal button.on{border-color:#1c1c1a;background:#f7f6f2;font-weight:600;color:#1c1c1a}
.pal button.on:after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:0 0 0 2px rgba(28,28,26,.08)}
.cab{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.cab .r{display:flex;align-items:center;gap:6px}
.cab .r span{flex:none;width:98px;font-size:10.5px;color:#6a6a62}
.cab .r button{flex:1;border:1px solid #e0ded6;background:#fff;border-radius:6px;padding:4px 0;font-size:10.5px;color:#4a4a44}
.cab .r button.on{background:#1c1c1a;border-color:#1c1c1a;color:#fff;font-weight:600}
.acts{display:flex;gap:6px;margin-top:9px}
.acts button{flex:1;border:0;border-radius:8px;padding:9px 0;font-size:12.5px;font-weight:600}
.acts .go{background:#1c1c1a;color:#fff}
.acts .rs{background:#f0efea;color:#4a4a44;flex:0 0 84px}

/* 结果层 */
.sheet{position:fixed;inset:0;background:rgba(20,20,18,.42);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet .in{background:#fff;width:100%;max-height:82%;border-radius:16px 16px 0 0;padding:16px 14px 20px;overflow:auto}
.sheet h3{font-size:15px;font-weight:600;margin-bottom:3px}
.sheet .sub{font-size:11.5px;color:#8a8a82;margin-bottom:12px}
.big{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px}
.big .n{font-size:40px;font-weight:700;line-height:1;letter-spacing:-1px}
.big .u{font-size:12px;color:#8a8a82;padding-bottom:4px}
.big .tag{margin-left:auto;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px}
.tag.ok{background:#e8f5ec;color:#1a7f45}
.tag.no{background:#fdeceb;color:#c0322a}
.grp{margin-top:12px}
.grp .h{font-size:11.5px;color:#8a8a82;margin-bottom:5px}
.it{display:flex;gap:7px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #f2f1ec;font-size:12px}
.it .k{flex:none;width:15px;font-weight:700}
.it .k.y{color:#1a7f45}
.it .k.n{color:#c0322a}
.it .d{flex:1;color:#3a3a34}
.it .s{flex:none;color:#a0a098;font-size:10.5px;padding-top:1px}
.it.bad .d{color:#c0322a}
.close{margin-top:16px;width:100%;border:0;border-radius:10px;background:#1c1c1a;color:#fff;padding:12px 0;font-size:13.5px;font-weight:600}

/* 任务切换 */
.sw{display:flex;flex:none;border:1px solid #ddd8cf;border-radius:7px;overflow:hidden}
.sw button{border:0;background:#faf9f6;color:#6a6a62;font-size:10.5px;padding:4px 8px;font-weight:600}
.sw button.on{background:#1c1c1a;color:#fff}
.navrow{display:flex;align-items:center;gap:8px;margin-top:7px}
.navrow nav{flex:1;margin-top:0}
.navrow .m{flex:none;font-size:10.5px;color:#7a7a74;display:flex;gap:8px;white-space:nowrap}
.navrow .m b{color:#1c1c1a;font-weight:600}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.view.off{display:none}
.hide{display:none !important}

/* K32 步骤表单 */
.stepbar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.stepbar .st{flex:1;min-width:0;font-size:12px;font-weight:600;color:#1c1c1a;line-height:1.3}
.stepbar .st small{display:block;font-weight:400;color:#9a9a92;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepbar button{flex:none;width:29px;height:27px;border:1px solid #e0ded6;background:#fff;border-radius:7px;font-size:14px;color:#4a4a44;line-height:1}
.stepbar button:disabled{opacity:.35}
.form{max-height:29vh;overflow:auto;padding-right:3px}
.form .brief{background:#f4f3ee;border:1px solid #ddd8cf;border-radius:9px;padding:9px 11px;font-size:12px;color:#55534c;line-height:1.6;margin-bottom:8px}
.form .brief b{color:#1c1c1a}
.form::-webkit-scrollbar{width:3px}
.form::-webkit-scrollbar-thumb{background:#d5d3ca;border-radius:2px}
.hint{font-size:10.5px;line-height:1.5;color:#6a6a62;background:#f6f5f0;border-radius:7px;padding:6px 9px;margin-bottom:9px}
.fld{margin-bottom:9px}
.fld>.fl{font-size:10.5px;color:#8a8a82;margin-bottom:4px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid #e0ded6;background:#fff;border-radius:7px;padding:4px 9px;font-size:10.5px;color:#4a4a44;line-height:1.3}
.chips button.on{background:#1c1c1a;border-color:#1c1c1a;color:#fff;font-weight:600}
.numrow{display:flex;align-items:center;gap:5px}
.numrow input{width:92px;border:1px solid #e0ded6;border-radius:7px;padding:5px 8px;font-size:12px;background:#fff;color:#1c1c1a}
.numrow span{font-size:10.5px;color:#9a9a92}
.odos{display:flex;flex-direction:column;gap:4px}
.odo{display:flex;align-items:center;gap:7px;border:1px solid #e8e6df;background:#fff;border-radius:7px;padding:4px 8px;font-size:10.5px;color:#4a4a44;text-align:left;line-height:1.35}
.odo .n{flex:none;width:16px;height:16px;border-radius:50%;background:#eeeee8;color:#9a9a92;font-size:9.5px;display:flex;align-items:center;justify-content:center;font-weight:700}
.odo.on{border-color:#1c1c1a;background:#f7f6f2;font-weight:600;color:#1c1c1a}
.odo.on .n{background:#1c1c1a;color:#fff}
.seq{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.seq i{font-style:normal;font-size:10px;background:#eeeee8;border-radius:5px;padding:2px 6px;color:#5a5a52}
.knob{cursor:pointer}
.knob circle{transition:r .12s,opacity .12s}
.knob .kh{transition:transform .22s cubic-bezier(.22,1,.36,1)}
/* 工器具台热点 */
.tspot{cursor:pointer}
.tspot .tring{transition:stroke .2s,opacity .2s}
.tspot .tring.pulse{animation:tpulse 1.8s ease-in-out infinite}
@keyframes tpulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.95}}
/* 前几步「检查柜子」交互圈：高亮提示，一眼就明白（用户思维）；完成态 pulse 移除后光晕自动消失 */
.tspot .tring.bright{stroke-width:3.6}
.tspot .tring.bright.pulse{filter:drop-shadow(0 0 5px rgba(255,208,70,.95)) drop-shadow(0 0 13px rgba(255,175,25,.72));
  animation:tpulseBright 1.55s ease-in-out infinite}
@keyframes tpulseBright{0%,100%{stroke-opacity:.92}50%{stroke-opacity:1}}
.tnum{font:700 17px/1 -apple-system,"PingFang SC",sans-serif;fill:#22261f}
.tlab{font:600 19px/1 -apple-system,"PingFang SC",sans-serif;fill:#eef1ec}

/* ---------- 电压表特写弹层 ---------- */
.vmask{position:fixed;inset:0;background:rgba(10,12,10,.55);z-index:60;display:none;
  align-items:flex-end;justify-content:center}
.vmask.on{display:flex}
.vcard{width:min(430px,100%);background:#f6f5f0;border-radius:16px 16px 0 0;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25);
  max-height:88%;overflow:auto}
.vhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.vhd b{font-size:15px;color:#22241d}
.vhd button{border:0;background:#e4e2da;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.vdial{background:#1b1e1a;border-radius:12px;padding:8px}
/* 实拍照片弹层：竞品同款——进线柜实拍底图 + 真实把手照片叠层 + 实拍表盘叠指针 */
.vphoto{position:relative;width:100%}
.vphoto .base{width:100%;display:block;border-radius:8px}
.vh{position:absolute;left:10.3%;top:60.9%;width:8.5%;height:17.2%;
  transform-origin:50% 32%;transition:transform .36s ease;pointer-events:none}
.vsvg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.vring{position:absolute;left:14.55%;top:66.4%;width:56px;height:56px;margin:-28px 0 0 -28px;
  border:2px dashed rgba(244,211,79,.8);border-radius:50%;pointer-events:none;
  animation:vpulse 1.6s ease-in-out infinite}
@keyframes vpulse{0%,100%{opacity:.35}50%{opacity:.95}}
.vhite{position:absolute;left:6%;top:55%;width:17.5%;height:23%;background:transparent;
  border:0;padding:0;cursor:pointer}
/* 竞品同源器件图层：位置按竞品 IncomingCabinetPanel wxss（950×1583 基图百分比换算到 950×740 裁剪） */
.vlamp{position:absolute;width:8%;height:10.3%;transform:translate(-50%,-50%);
  pointer-events:none;z-index:3}
.vlamp img{width:100%;height:100%;object-fit:contain;display:block}
.vsw{position:absolute;width:8%;height:10.7%;transform:translate(-50%,-50%);
  transition:transform .24s ease;pointer-events:none;z-index:4}
.vsw img{width:100%;height:100%;object-fit:contain;display:block}
.vsw.off{transform:translate(-50%,-50%) rotate(-90deg)}
.vsw.on{transform:translate(-50%,-50%) rotate(90deg)}
.vbtn{position:absolute;width:8%;height:10.7%;transform:translate(-50%,-50%);z-index:4}
.vbtn img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.vhit{position:absolute;transform:translate(-50%,-50%);background:transparent;
  border:0;padding:0;cursor:pointer;z-index:7}
.vhit.sw{left:38.8%;top:79.2%;width:12%;height:15%}
.vhit.close{left:62%;top:79.2%;width:10%;height:13%}
.vhit.open{left:86.5%;top:79.2%;width:10%;height:13%}
.vchips{display:flex;gap:6px;margin-top:8px}
.vchips button{flex:1;border:1px solid #c9c6ba;background:#fff;border-radius:8px;
  padding:7px 0;font-size:12px;font-weight:600;color:#5c5e55;cursor:pointer}
.vchips button.on{background:#191a16;color:#f4d34f;border-color:#191a16}
.vread{display:flex;gap:8px;margin-top:10px}
.vread .cell{flex:1;background:#fff;border:1px solid #ddd;border-radius:10px;padding:7px 0;text-align:center}
.vread .cell small{display:block;color:#8a877c;font-size:11px}
.vread .cell b{font-size:16px;color:#22241d}
.vread .cell.z b{color:#b3341f}
.vbtns{display:flex;gap:8px;margin-top:10px}
.vbtns button{flex:1;border:1px solid #c9c6ba;background:#fff;border-radius:10px;
  padding:10px 0;font-size:13px;font-weight:700;color:#26281f;cursor:pointer}
.vbtns button.pri{background:#191a16;color:#fff;border-color:#191a16}
.vhint{margin-top:8px;font-size:12px;color:#8a877c;text-align:center;min-height:16px}

/* ---------- 第 5 步 面板特写弹层（点柜子 → 特写里点器件读状态） ---------- */
.pstage{position:relative;width:100%;height:52vh;max-height:420px;min-height:250px;overflow:hidden;
  border-radius:10px;background:#111413}
.pimg{position:absolute;left:0;top:0;transform-origin:0 0;
  transition:transform .5s cubic-bezier(.22,1,.36,1)}
.pimg img.base{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.phits{position:absolute;inset:0;pointer-events:none}
.phits .pdev{pointer-events:auto}
.pdev{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);
  border:0;background:transparent;padding:0;cursor:pointer;z-index:3;
  filter:drop-shadow(0 0 3px rgba(0,0,0,.72))}
.pdev .rg{position:absolute;inset:0;border-radius:50%;border:2px solid #f1c40f;
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 0 6px rgba(241,196,15,.16),0 0 16px rgba(241,196,15,.5);
  animation:ppulse 1.7s ease-in-out infinite}
@keyframes ppulse{0%,100%{opacity:.55}50%{opacity:1}}
.pdev.done .rg{border-color:#39a96b;box-shadow:0 0 0 5px rgba(57,169,107,.15);animation:none}
.pdev.big{width:120px;height:120px}
.pdev.big .tg{bottom:100px}
.pdev.up .tg{bottom:104px}
.pdev.side .tg{left:calc(100% + 12px);top:50%;bottom:auto;transform:translateY(-50%)}
.pdev.wide .tg{bottom:auto;top:-42px}
.pdev .tg{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);white-space:nowrap;
  background:rgba(18,22,20,.88);color:#f2efe6;font-size:11px;line-height:1.5;
  padding:2px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.14)}
.pdev.done .tg{color:#bfe9cc;border-color:rgba(57,169,107,.5)}
.pnote{margin-top:8px;font-size:12.5px;color:#8a877c;text-align:center;min-height:18px}
.pfoot{margin-top:6px;display:flex;justify-content:space-between;align-items:center;
  font-size:11.5px;color:#8a877c}
.pfoot b{color:#22241d}

/* ---------- 第 6 步 后门发热检查特写（点柜 → 开门 → 手电筒 → 测温 → 挂牌） ---------- */
#tstage{background:#0e1110}
.tsvg{position:absolute;left:0;top:0;pointer-events:none}
.tsvg.door{z-index:5}
.tdoor{transition:transform .58s cubic-bezier(.34,.7,.24,1);transform:translateX(0)}
.tdoor.open{transform:translateX(-1088px)}
#timg.dim img.base{filter:brightness(.7) saturate(.92)}
#timg.lit img.base{filter:brightness(1.14) saturate(1.04) contrast(1.03)}
.tdock{position:absolute;left:8px;bottom:8px;display:flex;gap:7px;z-index:7}
.tchip{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;width:56px;padding:4px 0 3px;
  border:1px solid rgba(255,255,255,.22);background:rgba(16,20,18,.78);border-radius:10px;cursor:pointer;
  backdrop-filter:blur(4px);transition:border-color .18s,box-shadow .18s,opacity .18s}
.tchip img{width:24px;height:30px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));pointer-events:none}
.tchip span{font-size:9.5px;line-height:1.15;color:#eae5d6;white-space:nowrap}
.tchip.done{border-color:#39a96b;box-shadow:0 0 0 2px rgba(57,169,107,.22);background:rgba(22,44,30,.82)}
.tchip.done span{color:#a9e8be}
.tchip.lock{opacity:.34}
.tchip.ready{border-color:#f1c40f;box-shadow:0 0 0 2px rgba(241,196,15,.28)}
.tread{position:absolute;right:8px;top:8px;z-index:7;display:none;padding:5px 10px;border-radius:9px;
  background:rgba(16,20,18,.85);border:1px solid rgba(255,255,255,.18);color:#ffd76a;
  font:700 12px/1.35 -apple-system,"PingFang SC",sans-serif;letter-spacing:.2px}
.tread.on{display:block}
.tread.bad{color:#ff8f70;border-color:rgba(226,67,47,.66);background:rgba(46,14,10,.86)}
.tread small{display:block;font-weight:400;font-size:9.5px;color:#cfc9b8}
.pdev.hot .rg{border-color:#e2432f;box-shadow:0 0 0 6px rgba(226,67,47,.2),0 0 18px rgba(226,67,47,.6)}
.pdev.dust .rg{border-color:#c9a227;box-shadow:0 0 0 6px rgba(201,162,39,.18)}
.pdev.low .tg{bottom:auto;top:78px}

/* ---------- 第 8 步 故障排除特写（点柜 → 开门 → 摘牌 → 扳手紧固 / 毛刷清扫） ---------- */
#rstage{background:#0e1110}
#rimg.dim img.base{filter:brightness(.78) saturate(.94)}
.rview{position:absolute;right:8px;bottom:8px;z-index:7;display:none;padding:6px 10px;border-radius:9px;
  border:1px solid rgba(255,255,255,.24);background:rgba(16,20,18,.84);color:#eae5d6;
  font:600 11px/1.2 -apple-system,"PingFang SC",sans-serif;cursor:pointer;backdrop-filter:blur(4px)}
.rview.on{display:block}
.tchip svg{width:24px;height:28px;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}

/* ---------- 第 7/9 步 停送电操作卡（模拟屏 → 柜前 → 后门/面板，按顺序点） ---------- */
#ostage{background:#0e1110;height:58vh;max-height:520px;min-height:280px}
#ocard{max-height:calc(100vh - 20px);display:flex;flex-direction:column}
#ocard #ostage{flex:1 1 auto;min-height:220px}
.oviews{position:absolute;left:8px;top:8px;display:flex;gap:5px;z-index:7;flex-wrap:wrap;max-width:calc(100% - 76px)}
.oviews button{border:1px solid rgba(255,255,255,.22);background:rgba(18,22,20,.7);color:#d8d4c6;
  font-size:10px;padding:3px 8px;border-radius:999px;cursor:pointer;backdrop-filter:blur(4px);white-space:nowrap;opacity:.92}
.oviews button.on{background:#d8c26a;color:#201f18;border-color:#d8c26a;font-weight:700}
.oviews button.done{border-color:rgba(90,200,140,.6)}
.oviews button.done::after{content:' ✓';color:#7ee0a4}
.oviews button.on.done::after{color:#2f6b46}
.osvg{position:absolute;left:0;top:0;pointer-events:none;z-index:1;transform-origin:0 0}
.opop{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:1;object-fit:contain}
.osvg .odoor{transition:transform .58s cubic-bezier(.34,.7,.24,1);transform:translateX(0)}
.osvg .odoor.open{transform:translateX(-1088px)}
.otag2{position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,-50%);
  background:rgba(18,22,20,.86);border:1px solid rgba(255,255,255,.16);color:#f2efe6;
  font-size:11px;padding:2px 8px;border-radius:7px;white-space:nowrap}
.otag2.ok{color:#bfe9cc;border-color:rgba(57,169,107,.55)}
.otag2.warn{color:#ffd7cf;border-color:rgba(226,67,47,.55)}
.ospark{position:absolute;z-index:4;pointer-events:none;width:26px;height:26px;border-radius:50%;
  transform:translate(-50%,-50%);background:radial-gradient(circle,#fffde0 0%,#ffd54a 45%,rgba(255,180,40,0) 72%);
  animation:ospark .55s ease-out forwards}
@keyframes ospark{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}}
.obtn{display:block;width:100%;margin-top:10px;border:1px solid #191a16;background:#191a16;color:#fff;
  border-radius:10px;padding:11px 0;font-size:13.5px;font-weight:700;cursor:pointer}
.oprog{position:absolute;right:10px;top:10px;z-index:7;background:rgba(18,22,20,.74);color:#e8e3d3;
  font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(4px)}

/* 首页穿戴门禁（硬前置：三件穿戴齐全才放行） */
#ppeGate{position:fixed;inset:0;z-index:60;background:#20211f;color:#f4f4f0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
#ppeGate.off{display:none}
#ppeGate h2{font-size:20px;font-weight:600;letter-spacing:.4px;margin-bottom:5px}
#ppeGate .sub{font-size:12px;color:#a9aaa4;text-align:center;line-height:1.6;margin-bottom:18px}
#ppeGate .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:400px}
#ppeGate .card{position:relative;background:#2c2d2a;border:1px solid #454641;border-radius:12px;padding:12px 8px;text-align:center;user-select:none;cursor:pointer}
#ppeGate .card img{display:block;width:auto;height:auto;max-width:100%;max-height:104px;margin:0 auto 8px;object-fit:contain;background:#f2f2ee;border-radius:9px;padding:7px;box-sizing:border-box}
#ppeGate .card .nm{font-size:13px;font-weight:600}
#ppeGate .card .st{font-size:11px;color:#a9aaa4;margin-top:3px}
#ppeGate .card.done{border-color:#54b56c}
#ppeGate .card.done .st{color:#7bd995;font-weight:600}
#ppeGate .card.skip{opacity:.45;cursor:default}
#ppeGate .card.skip .st{color:#8f908a}
#ppeGate .card.done:after{content:"✓";position:absolute;top:7px;right:9px;width:21px;height:21px;line-height:21px;border-radius:50%;background:#3d9954;color:#fff;font-size:13px;font-weight:600}
#ppeGate .foot{display:flex;gap:10px;width:100%;max-width:400px;margin-top:18px}
#ppeGate .foot button{flex:1;border:0;border-radius:10px;padding:12px 0;font-size:13.5px;font-weight:600}
#ppeGate .foot .rs{background:#3a3b37;color:#d8d8d2;flex:0 0 92px}
#ppeGate .foot .go{background:#e8851a;color:#fff}
#ppeGate .foot .go:disabled{opacity:.4}
#ppeGate .note{font-size:11px;color:#8f908a;text-align:center;margin-top:12px;line-height:1.6}

</style>

<body>
<div class="app">
  <header>
    <div class="hd">
      <div class="t" id="title">K32-01 低压配电柜的运行维护</div>
      <!-- 独立项目：无 K33 切换 -->
      <div class="sw hide" id="sw">
        <button data-t="k33" class="on">K33-01</button>
        <button data-t="k32">K32-01</button>
      </div>
    </div>
    <div class="navrow">
      <nav id="tabs"></nav>
      <nav id="tabs2" class="hide"></nav>
      <div class="m" id="meta"><span class="m33 hide">已接 <b id="cnt">0</b>/21</span><span class="m33 hide" id="sc">—</span><span class="m32" id="k32prog">1/11</span></div>
    </div>
  </header>

  <div class="view off" id="viewK33">
  <div class="stage" id="vp">
    <svg id="world" viewBox="0 0 975 5800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity=".13"/>
        </filter>
      </defs>
      <g id="scenes"></g>
      <g id="wireLayer"></g>
      <g id="ringLayer"></g>
    </svg>
    <div class="tip" id="tip"></div>
  </div>

  <div class="tool">
    <div class="lab">选线色 → 点端子</div>
    <div class="pal" id="pal"></div>
    <div class="cab" id="cab"></div>
    <div class="acts">
      <button class="go" id="btnGo">提交评分</button>
      <button class="rs" id="btnRs">复位</button>
    </div>
  </div>
  </div>

  <div class="view" id="viewK32">
    <div class="stage" id="vp2">
      <svg id="world2" viewBox="0 0 975 8700" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="knobBez" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c6cabd"/>
            <stop offset=".55" stop-color="#7d8578"/>
            <stop offset="1" stop-color="#293128"/>
          </linearGradient>
          <linearGradient id="knobHdl" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#080e0b"/>
            <stop offset=".5" stop-color="#333c32"/>
            <stop offset="1" stop-color="#0c120e"/>
          </linearGradient>
          <!-- 作用区域须覆盖整个 K32 长卷世界画布(975×8700)，否则第6场景 y≈7268 的光带会被 mask 裁掉 -->
          <mask id="mimicInkMask" maskUnits="userSpaceOnUse" x="0" y="0" width="975" height="8700">
            <image id="mimicMaskImg" x="0" y="0" width="1402" height="1122" href="assets/mimic-panel-compact-v5mask.png"/>
          </mask>
          <linearGradient id="mimicMetal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fdfefe"/><stop offset=".16" stop-color="#8b9095"/>
            <stop offset=".38" stop-color="#e9ecef"/><stop offset=".54" stop-color="#6f7479"/>
            <stop offset=".76" stop-color="#cfd3d7"/><stop offset="1" stop-color="#fdfefe"/>
          </linearGradient>
        </defs>
        <g id="scenes2"></g>
        <g id="mimicLiveLayer"></g>
        <g id="knobLayer"></g>
        <g id="spotLayer"></g>
      </svg>
      <div class="tip" id="tip2"></div>
      <button class="flipbtn hide" id="flip2">柜体背面 ›</button>
    </div>
    <div class="tool">
      <div class="stepbar">
        <button id="prevStep">‹</button>
        <div class="st"><span id="k32st">第 1/11 步</span><small id="k32name"></small></div>
        <button id="nextStep">›</button>
      </div>
      <div class="form" id="k32form"></div>
      <div class="acts">
        <button class="go" id="btnGo2">提交评分</button>
        <button class="rs" id="btnRs2">复位</button>
      </div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

<div id="ppeGate">
  <h2>考前准备 · 个人穿戴</h2>
  <p class="sub">请逐项穿戴下列防护用品，全部完成后方可进入操作现场。<br>本步骤已前置，进入后不再重复检查穿戴。</p>
  <div class="grid" id="ppeGrid"></div>
  <div class="foot">
    <button class="rs" id="ppeRedo">重新穿戴</button>
    <button class="go" id="ppeEnter" disabled>穿戴完毕 · 进入现场</button>
  </div>
  <p class="note">安全帽 / 工作服 必穿，绝缘鞋与绝缘胶鞋二选一；绝缘手套进入现场后在工器具台选用</p>
</div>

<div class="vmask" id="vmask">
  <div class="vcard" id="vcard">
    <div class="vhd"><b>进线柜 · 电压转换开关特写</b><button id="vClose">关闭</button></div>
    <div class="vdial" id="vdial"></div>
    <div class="vread" id="vread"></div>
    <div class="vbtns">
      <button id="vRec">记录此挡读数</button>
      <button id="vRecI">记录三相电流</button>
      <button class="pri" id="vNext">切换下一挡</button>
    </div>
    <div class="vhint" id="vhint">点旋钮或「切换下一挡」换挡：0 → UAB → UBC → UCA</div>
  </div>
</div>

<div class="vmask" id="pmask">
  <div class="vcard" id="pcard">
    <div class="vhd"><b id="ptitle">面板特写</b><button id="pClose">关闭</button></div>

    <div class="pnote" id="pnote"></div>
    <div class="pfoot"><span id="pbar">点亮的器件圈</span><span id="pall"></span></div>
  </div>
</div>

<div class="vmask" id="tmask">
  <div class="vcard" id="tcard">
    <div class="vhd"><b id="ttitle">后门发热检查</b><button id="tClose">关闭</button></div>
    <div class="pstage" id="tstage">
      <div class="pimg" id="timg"></div>
      <div class="phits" id="thits"></div>
      <div class="tread" id="tread"></div>
      <div class="tdock">
        <button class="tchip" id="tchipLight"><img src="assets/tools/flashlight.png" alt=""><span>手电筒</span></button>
        <button class="tchip" id="tchipGun"><img src="assets/thermal-gun.png" alt=""><span>测温枪</span></button>
      </div>
    </div>
    <div class="pnote" id="tnote"></div>
    <div class="pfoot"><span id="tbar"></span><span id="tall"></span></div>
  </div>
</div>

<div class="vmask" id="rmask">
  <div class="vcard" id="rcard">
    <div class="vhd"><b id="rtitle">410 补偿柜 · 故障排除</b><button id="rClose">关闭</button></div>
    <div class="pstage" id="rstage">
      <div class="pimg" id="rimg"></div>
      <div class="phits" id="rhits"></div>
      <div class="tread" id="rread"></div>
      <button class="rview" id="rview">看下方积灰 ↓</button>
      <div class="tdock">
        <button class="tchip" id="rchipWrench"><img src="assets/tools/wrench.png" alt=""><span>扳手</span></button>
        <button class="tchip" id="rchipBrush"><svg viewBox="0 0 24 28" aria-hidden="true"><rect x="10" y="1.5" width="4.4" height="10" rx="1.6" fill="#e0c98f"/><path d="M7.2 11.5h9.6l1.4 4.6H5.8z" fill="#c2c8cb"/><path d="M5.8 16.1h13.4l-1.5 8.4H7.3z" fill="#efe0b4"/></svg><span>毛刷</span></button>
      </div>
    </div>
    <div class="pnote" id="rnote"></div>
    <div class="pfoot"><span id="rbar"></span><span id="rall"></span></div>
  </div>
</div>

<div class="vmask" id="omask">
  <div class="vcard" id="ocard">
    <div class="vhd"><b id="otitle">停电操作</b><button id="oClose">关闭</button></div>

      <div class="pimg" id="oimg"></div>
      <div class="phits" id="ohits"></div>
      <div class="oviews" id="oviews"></div>

    </div>
    <div class="pnote" id="onote"></div>
    <div class="pfoot"><span id="obar"></span><span id="otip"></span></div>
  </div>
</div>
