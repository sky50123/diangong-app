<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>安全用具专项训练 · 电工随时练</title>
<style>
:root{--c-bg:#f2f4f8;--c-card:#fff;--c-ink:#1f2430;--c-sub:#6b7280;--c-main:#2563eb;--c-ok:#16a34a;--c-bad:#dc2626;--c-line:#e5e7eb}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--c-bg);color:var(--c-ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:32px}
header{background:rgba(255,255,255,.97);border-bottom:1px solid var(--c-line);box-shadow:0 2px 10px rgba(15,23,42,.07);color:var(--c-ink);padding:10px 16px 9px;position:sticky;top:0;z-index:10}
header .hRow{display:flex;align-items:center;gap:9px}
header .hBar{flex:0 0 4px;width:4px;height:17px;border-radius:2px;background:linear-gradient(180deg,#3b82f6,#1e40af)}
header h1{font-size:16px;font-weight:700;color:var(--c-ink);letter-spacing:.3px}
header .score{font-size:12px;color:var(--c-sub);margin-top:4px;padding-left:13px}
header .score b{color:var(--c-main);font-weight:700}
header .score .bad{color:var(--c-bad);font-weight:700}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--c-line);position:sticky;top:61px;z-index:9;overflow-x:auto}
.tabs button{flex:0 0 auto;border:none;background:none;padding:11px 12px;font-size:14px;color:var(--c-sub);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--c-main);border-bottom-color:var(--c-main);font-weight:600}
.wrap{padding:12px 14px}
.stepbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stepbar span{font-size:12px;padding:4px 10px;border-radius:999px;background:#e8edf7;color:var(--c-sub)}
.stepbar span.done{background:#dcfce7;color:var(--c-ok)}
.stepbar span.cur{background:var(--c-main);color:#fff;font-weight:600}
.card{background:var(--c-card);border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{font-size:16px;margin-bottom:4px}
.card .desc{font-size:13px;color:var(--c-sub);line-height:1.5;margin-bottom:14px}
.acts{display:flex;flex-direction:column;gap:9px}
.act{border:1.5px solid var(--c-line);border-radius:10px;padding:11px 12px;font-size:14px;line-height:1.45;background:#fafbfc;cursor:pointer;transition:all .15s;display:flex;gap:10px;align-items:center}
.act .tx{flex:1}
.act .d{display:block;font-size:12px;color:var(--c-sub);margin-top:2px}
.act.done-ok{border-color:var(--c-ok);background:#f0fdf4}
.act.done-ok::after{content:" ✓";color:var(--c-ok);font-weight:700}
.act.bad{border-color:var(--c-bad);background:#fef2f2;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
.opts{display:grid;gap:12px}
.opt{border:1.5px solid var(--c-line);border-radius:12px;padding:10px 10px 12px;font-size:14px;cursor:pointer;background:#fafbfc;text-align:center}
.opt .imgwrap{border-radius:8px;overflow:hidden;background:#eef1f6;margin-bottom:8px;position:relative}
.opt .imgwrap img{display:block;width:100%;height:auto}
.tagbtn{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.94);border:1px solid #d1d5db;border-radius:999px;font-size:11px;color:#374151;padding:4px 10px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tagbtn:active{background:#e5e7eb}
.tagbtn.nocert{color:#9ca3af;border-style:dashed;background:rgba(249,250,251,.94)}
/* 统一标准合格证吊牌（全站唯一固定样式，CSS 绘制，无卷边） */
.cert{position:absolute;top:8px;right:8px;width:56px;min-height:60px;height:auto;background:#fff;border:2px solid #c0392b;border-radius:3px 3px 10px 10px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0}
.cert::before{content:"";position:absolute;top:-8px;left:50%;margin-left:-7px;width:14px;height:9px;border:2px solid #9aa0a6;border-bottom:none;border-radius:8px 8px 0 0}
.cert .t{font-size:12px;font-weight:800;color:#c0392b;letter-spacing:2px;margin-left:2px}
.cert .lv{font-size:9px;font-weight:700;color:#111;line-height:1.2;text-align:center;padding:0 3px}
.certStatic{pointer-events:none;cursor:default}
.certStatic .lv{margin-left:0;letter-spacing:0}
.hsWrap{display:flex;flex-direction:column;gap:10px}
.hsImg{position:relative;border-radius:10px;overflow:hidden;background:#eef1f6}
.hsImg img{display:block;width:100%;height:auto}
.hs{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;background:rgba(37,99,235,.92);color:#fff;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:0}
.hs.done-ok{background:rgba(22,163,74,.94);font-size:0}
.hs.done-ok::after{content:"✓";font-size:14px}
.hs.future{background:rgba(37,99,235,.42);box-shadow:none;font-size:12px;opacity:.85}
/* ===== 接地线装拆 · 拖杆接线场景（gndsim） ===== */
.gndScene{position:relative;width:100%;aspect-ratio:400/344;background:linear-gradient(160deg,#f4f7fa,#e4eaf1 62%,#dbe3ec),repeating-linear-gradient(0deg,rgba(148,163,184,.07) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(148,163,184,.07) 0 1px,transparent 1px 22px);border:1px solid #dbe4ee;border-radius:12px;overflow:hidden;touch-action:none;user-select:none}
.gndScene svg.base{position:absolute;inset:0;width:100%;height:100%}
.gndDot{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.32);pointer-events:none;transition:transform .15s;z-index:7}
/* 相色：黄 / 绿 / 红 / 中性蓝 / 接地黄 */
.gndDot[data-id="A"]{background:#f5c518;color:#3f2d00}
.gndDot[data-id="B"]{background:#22c55e;color:#fff}
.gndDot[data-id="C"]{background:#ef4444;color:#fff}
.gndDot[data-id="D"]{background:#3b82f6;color:#fff}
.gndDot[data-id="gnd"]{background:#eab308;color:#3f2d00}
.gndDot.cur{transform:scale(1.16);outline:3px solid #2563eb;outline-offset:2px;animation:gndPulse 1.2s infinite}
.gndDot.ok{background:#16a34a;color:#fff;font-size:0;transform:scale(.94)}
.gndDot.ok::after{content:"✓";font-size:14px}
.gndDot.near{transform:scale(1.3);outline:3px solid #f59e0b;outline-offset:2px}
.gndLbl{position:absolute;transform:translate(-50%,0);font-size:10.5px;font-weight:700;color:#1e293b;background:rgba(255,255,255,.9);border:1px solid rgba(148,163,184,.55);padding:1px 5px;border-radius:7px;white-space:nowrap;pointer-events:none;line-height:1.35}
.gndLbl.lft{transform:translate(-4%,0)}
.gndPiece{position:absolute;transform:translateX(-50%);z-index:4;transition:left .18s,top .18s,opacity .18s;touch-action:none}
.gndPiece img{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 3px 7px rgba(15,23,42,.32))}
.gndPiece.grab{cursor:grab}.gndPiece.locked,.gndPiece.back{pointer-events:none}.gndPiece.back{z-index:3}
#gndDrag{position:absolute;display:none;transform:translateX(-50%);z-index:12;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(15,23,42,.4))}
#gndDrag img{display:block;width:100%;height:auto}
.gndTray{position:absolute;transform:translate(-50%,-50%);border:2px dashed #94a3b8;border-radius:10px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#475569;text-align:center;line-height:1.35;z-index:2;pointer-events:none}
.gndTray.hot{border-color:#2563eb;background:rgba(219,234,254,.85);color:#1d4ed8}
.gndTrayLbl{position:absolute;transform:translateX(-50%);font-size:10px;font-weight:700;color:#475569;white-space:nowrap;pointer-events:none;z-index:5}
@keyframes gndPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}50%{box-shadow:0 0 0 9px rgba(37,99,235,0)}}
.hs.cur{background:rgba(37,99,235,.98);border-color:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.32),0 1px 5px rgba(0,0,0,.4);animation:hsPulse 1.3s infinite;z-index:5}
@keyframes hsPulse{0%,100%{box-shadow:0 0 0 3px rgba(37,99,235,.38),0 1px 5px rgba(0,0,0,.4)}55%{box-shadow:0 0 0 10px rgba(37,99,235,0),0 1px 5px rgba(0,0,0,.4)}}
.refImg{margin:0 0 10px}
.refImg img{display:block;width:100%;max-width:420px;margin:0 auto;border-radius:10px;border:1px solid #e2e8f0}
.hs.bad{background:rgba(220,38,38,.94)}
.hsTag{position:absolute;transform:translate(12px,-50%);background:#fff;border:1px solid #cbd5e1;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700;color:#334155;white-space:nowrap;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.18);z-index:2}
.ordBar{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;line-height:1.5}
.hs.bad{background:rgba(220,38,38,.94);animation:shake .3s}
.trapBtn{border:1px dashed #fca5a5;background:#fef2f2;cursor:pointer}
.trapBtn .tx{color:#b91c1c}
/* 冲击试验交互场景 */
.simWrap{border:1.5px solid var(--c-line);border-radius:12px;overflow:hidden;background:linear-gradient(#f8fafc,#eef2f7)}
.simBar{padding:9px 12px;font-size:13px;font-weight:700;color:#1f2937;background:#fff;border-bottom:1px dashed var(--c-line)}
.simBar .tag{color:#2563eb}
.simDots{display:flex;gap:5px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--c-line)}
.simDots i{flex:1;height:6px;border-radius:3px;background:#e5e7eb}
.simDots i.on{background:var(--c-ok)}
.simDots i.cur{background:#2563eb}
.simSvg{display:block;width:100%}
.simHot{cursor:pointer}
.simHot:hover{filter:brightness(1.08)}
.simOps{padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px;align-items:center;background:#fff;border-top:1px solid var(--c-line)}
.simHRow{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
.simH{font-size:22px;font-weight:800;color:#b45309;min-width:64px;text-align:center}
.simH.ok{color:var(--c-ok)}
.simRange{flex:1;max-width:240px;accent-color:#2563eb}
.simBtn{border:1.5px solid #2563eb;background:#dbeafe;color:#1d4ed8;border-radius:10px;font-size:14px;font-weight:700;padding:10px 22px;cursor:pointer}
.simBtn:active{background:#bfdbfe}
.simDoneTag{font-size:13px;color:var(--c-ok);font-weight:700}
@keyframes simjump{0%{transform:translateY(0)}18%{transform:translateY(16px)}40%{transform:translateY(-10px)}62%{transform:translateY(7px)}80%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.g-jump{animation:simjump 1.4s ease-in-out}
/* sim 教学引导：步骤清单 + 脉动光圈 + 序号气泡 */
.simList{padding:7px 12px;background:#fff;border-bottom:1px dashed var(--c-line);display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12px}
.simList .it{color:#9ca3af}
.simList .it.cur{color:#1d4ed8;font-weight:800}
.simList .it.done{color:var(--c-ok)}
/* —— 眼镜佩戴操作模拟（gw）—— */
.gwStage{position:relative;background:#fff;line-height:0}
.gwStage .person{display:block;width:100%}
.gwStage .person.adjust{animation:gwpAdj .7s ease}
@keyframes gwpAdj{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.gwGlass{position:absolute;pointer-events:none;transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1),width .5s ease;z-index:3}
.gwGlass.adjust{animation:gwAdj .7s ease}
@keyframes gwAdj{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.12)}100%{transform:translate(-50%,-50%) scale(1)}}
.gwHot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;z-index:4;background:rgba(37,99,235,.10);border:2px dashed rgba(37,99,235,.65);animation:gwPulse 1.3s infinite}
@keyframes gwPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.35)}55%{box-shadow:0 0 0 12px rgba(37,99,235,0)}}
.gwTag{position:absolute;z-index:5;background:rgba(22,163,74,.94);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:14px;line-height:1.3;white-space:nowrap}
.simTipT{font-size:12px;font-weight:800}
.pulseRing{transform-box:fill-box;transform-origin:center;animation:simPulse 1.6s ease-out infinite}
@keyframes simPulse{0%{opacity:.9;transform:scale(.65)}100%{opacity:0;transform:scale(1.5)}}
.hsList .act{cursor:pointer}
.hsList .act.done-ok::after{content:""}
.opt .lab{font-weight:500}
.opt .sub{display:block;font-size:12px;color:var(--c-sub);margin-top:2px}
.opt.ok-pick{border-color:var(--c-ok);background:#f0fdf4}
.opt.ok-pick .lab{color:var(--c-ok);font-weight:700}
.opt.ok-pick .lab::after{content:" ✓"}
.opt.bad-pick{border-color:var(--c-bad);background:#fef2f2;animation:shake .3s}
.opt.bad-pick .lab{color:var(--c-bad)}
.opt.bad-pick .lab::after{content:" ✗"}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow button{flex:1;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
.b-next{background:var(--c-main);color:#fff}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(20,24,34,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;max-width:86%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:14px;padding:22px 20px;width:82%;max-width:340px;text-align:center}
.modal h3{font-size:17px;margin-bottom:10px}
.modal p{font-size:14px;color:var(--c-sub);line-height:1.7;white-space:pre-line}
.modal .b-next{margin-top:16px;width:100%}
/* 制式产品合格证证面：表格式字段 + 检验合格章（全站七模块统一） */
.modal.certmode{max-width:430px}
.modal .certSheet{border:2px solid #1f2937;padding:10px 12px 12px;background:#fff;color:#111;text-align:left;position:relative;font-size:12px}
.modal .csHead{text-align:center;font-size:18px;font-weight:800;letter-spacing:6px;border-bottom:2px solid #1f2937;padding-bottom:6px;margin-bottom:2px}
.modal .csEn{text-align:center;font-size:9px;letter-spacing:1px;color:#555;margin-bottom:8px}
.modal .csTab{width:100%;border-collapse:collapse;table-layout:fixed}
.modal .csTab th,.modal .csTab td{border:1px solid #374151;padding:5px 6px;line-height:1.35;vertical-align:middle;word-break:break-all}
.modal .csTab th{background:#f3f4f6;width:74px;text-align:center;white-space:nowrap;font-weight:700}
.modal .csSign{display:flex;align-items:center;justify-content:space-between;min-height:70px;padding:4px 2px 0}
.modal .csDate{font-size:11px;color:#374151}
.modal .csSeal{position:static;flex:0 0 64px;width:64px;height:64px;margin-right:8px;border:2.5px double #c0392b;border-radius:50%;color:#c0392b;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-14deg);font-weight:800;font-size:11px;letter-spacing:1px;opacity:.92;pointer-events:none}
.modal .csSeal small{font-size:8px;letter-spacing:0;font-weight:600;margin-top:2px}
.modal .csFoot{text-align:center;font-size:10px;color:#6b7280;margin-top:8px}
.note{font-size:12px;color:#9ca3af;text-align:center;margin-top:18px;line-height:1.6}
.fatal-banner{background:#fef2f2;border:1.5px solid var(--c-bad);color:var(--c-bad);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<header>
  <div class="hRow"><span class="hBar"></span><h1>安全用具专项训练 · 交互验证</h1></div>
  <div class="score">当前模块得分：<b id="score">100</b> 分 ｜ 错误 <b id="errcnt">0</b> 次 ｜ <span id="fatalState">无否决项</span></div>
</header>
<div class="tabs">
  <button class="on" data-m="mat">绝缘垫</button>
  <button data-m="ladder">绝缘梯</button>
  <button data-m="board">登高板</button>
  <button data-m="gloves">绝缘手套</button>
  <button data-m="grounding">接地线</button>
  <button data-m="goggles">防护眼镜</button>
  <button data-m="harness">安全带</button>
</div>
<div class="wrap">
  <div class="fatal-banner" id="fatalBanner"></div>
  <div class="stepbar" id="stepbar"></div>
  <div class="card">
    <h2 id="stTitle"></h2>
    <div class="desc" id="stDesc"></div>
    <div id="stBody"></div>
    <div class="btnrow" id="btnRow" style="display:none">
      <button class="b-next" id="btnNext">下一步</button>
    </div>
  </div>
  <div class="note">专项训练版 v20261123-51 · 七模块：绝缘垫 / 绝缘梯 / 登高板 / 绝缘手套（高低压两种卷·自有素材）/ 接地线（实拍素材·图上装拆顺序）/ 防护眼镜（自有素材·佩戴操作模拟）/ 安全带（检查无假人·穿戴顺序点检）<br>外观检查直接在图上点检查点 · 选错安全不合格项直接 0 分 · 80 分及格</div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="mTitle">练习完成</h3>
    <div id="mBody"></div>
    <button class="b-next" onclick="closeModal()">知道了</button>
