<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>K44-01 创伤包扎 · 右前臂螺旋反折法</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#eef1f4; color:#1c222c; display:flex; flex-direction:column; overflow:hidden; }
  /* ---- 顶栏 ---- */
  #topbar { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:9px 12px;
            background:#2f3742; color:#fff; }
  #topbar .tt { font-size:14px; font-weight:600; margin-right:auto; }
  #stepIdx { font-size:12px; background:#465061; border-radius:10px; padding:3px 9px; }
  #curScore { font-size:13px; font-weight:700; color:#ffd76e; }
  /* ---- 舞台 ---- */
  #stage { flex:1 1 auto; position:relative; overflow:hidden; background:#f6f7f9; }
  #scene { position:absolute; inset:0 0 118px 0; overflow:hidden; }
  .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .layer { position:absolute; transition:opacity .5s, transform .5s; }
  .layer.show { opacity:1 !important; }
  .badge { position:absolute; background:#e8f7ee; color:#177a48; border:1px solid #9fd8b7;
           border-radius:8px; font-size:11px; padding:3px 8px; opacity:0; }
  .badge.show { opacity:1; }
  /* S1 现场环境：蹲姿图内三个可点检查点 */
  #squatFrame { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  #squatFrame .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
  /* S1 地面：蹲姿图是抠图白底，"地面稳固/撤离通道"原来悬在白底上；补一层柔和地面+鞋底投影 */
  #squatFloor { position:absolute; left:-14%; right:-14%; top:71%; bottom:-36%; z-index:0;
                background:linear-gradient(180deg, rgba(212,220,230,0) 0%, rgba(206,215,226,.46) 16%,
                           rgba(198,208,220,.66) 46%, rgba(190,202,215,.80) 100%);
                -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,#000 16%,#000 84%,rgba(0,0,0,0) 100%);
                mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0%,#000 16%,#000 84%,rgba(0,0,0,0) 100%); }
  .bootSh { position:absolute; border-radius:50%; z-index:0;
            background:radial-gradient(ellipse at center, rgba(36,46,58,.36) 0%,
                       rgba(36,46,58,.17) 46%, rgba(36,46,58,0) 74%); }
  /* 撤离通道：地面上的绿色指引箭头（透视）+ 国标"安全出口"牌（科目一标识牌素材） */
  #escArrow { position:absolute; z-index:2; left:17.5%; top:90.4%; width:22.5%; height:7.4%;
              transform:rotate(-5deg) skewY(3deg); transform-origin:100% 50%;
              background:linear-gradient(90deg,#3aa573 0%,#2f9a68 55%,#248457 100%);
              opacity:.88; filter:drop-shadow(0 2px 3px rgba(12,60,36,.20));
              clip-path:polygon(100% 20%, 40% 20%, 40% 0, 0 50%, 40% 100%, 40% 80%, 100% 80%); }
  #escSign { position:absolute; z-index:2; left:1.5%; top:79.4%; width:15.5%;
             transform:rotateX(13deg) rotate(-2deg); transform-origin:50% 100%;
             filter:drop-shadow(0 4px 7px rgba(20,44,32,.32)) drop-shadow(0 0 1px rgba(255,255,255,.7)); }
  #escSignSh { position:absolute; z-index:1; left:0.5%; top:93.6%; width:17.4%; height:3.4%;
               border-radius:50%; background:radial-gradient(ellipse at center, rgba(22,58,40,.30) 0%,
                          rgba(22,58,40,.14) 50%, rgba(22,58,40,0) 76%); }
  .envpt.lbtop { flex-direction:column-reverse; }
  .envpt { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column;
           align-items:center; gap:3px; cursor:pointer; z-index:4; }
  .envpt .d { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.96);
              border:2px solid #f0a63a; color:#b9760c; font-size:14px; font-weight:800;
              display:flex; align-items:center; justify-content:center;
              box-shadow:0 2px 9px rgba(0,0,0,.28); animation:ptPulse 1.6s ease-in-out infinite; }
  .envpt .lb { background:rgba(255,255,255,.94); border:1px solid #d8dde4; border-radius:6px;
               padding:2px 6px; font-size:10px; color:#33404f; white-space:nowrap; }
  .envpt.ok .d { background:#1d9e75; border-color:#1d9e75; color:#fff; animation:none; }
  .envpt.ok .d::before { content:"✓"; }
  .envpt.ok .d span { display:none; }
  .envpt.ok .lb { color:#177a48; border-color:#9fd8b7; background:#e8f7ee; }
  @keyframes ptPulse { 0%,100%{ box-shadow:0 0 0 0 rgba(240,166,58,.55); } 60%{ box-shadow:0 0 0 10px rgba(240,166,58,0); } }
  /* S1 手部热区：点环境三点后直接在图上手上点，完成"安慰·征得配合" */
  .handpt { position:absolute; width:58px; height:58px; border-radius:50%;
            transform:translate(-50%,-50%); z-index:5; cursor:pointer;
            border:2px dashed rgba(240,166,58,.75); background:rgba(240,166,58,.10);
            display:flex; align-items:center; justify-content:center;
            transition:.3s; }
  .handpt .handpt-lb { position:absolute; left:calc(100% + 5px); top:50%; transform:translateY(-50%);
                       background:rgba(255,255,255,.94); border:1px solid #f0c98a; border-radius:6px;
                       padding:2px 7px; font-size:10px; color:#b9760c; white-space:nowrap; }
  .handpt.ready { border-color:#f0a63a; background:rgba(240,166,58,.16);
                  animation:ptPulse 1.6s ease-in-out infinite; }
  .handpt.ready .handpt-lb { color:#8a5a0c; border-color:#f0a63a; font-weight:700; }
  .handpt.done { border-color:#1d9e75; background:rgba(29,158,117,.14); animation:none; cursor:default; }
  .handpt.done .handpt-lb { color:#177a48; border-color:#9fd8b7; background:#e8f7ee; }
  .handpt.done .handpt-lb::before { content:"✓ "; }
  /* ---- 图内动作交互点：把"点底部文字按钮"改成直接在图上点 ---- */
  .actpt { position:absolute; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%;
           background:rgba(255,255,255,.96); border:2px solid #f0a63a; color:#b9760c;
           box-shadow:0 2px 10px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center;
           cursor:pointer; z-index:8; animation:ptPulse 1.6s ease-in-out infinite;
           transition:width .25s,height .25s,background .25s,border-color .25s,opacity .25s; }
  .actpt .n { font-size:13px; font-weight:800; line-height:1; }
  .actpt .lb { position:absolute; top:calc(100% + 3px); left:50%; transform:translateX(-50%);
               background:rgba(255,255,255,.95); border:1px solid #f0c98a; border-radius:6px;
               padding:1px 6px; font-size:10px; color:#8a5a0c; white-space:nowrap; font-weight:700;
               box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .actpt.lbtop .lb { top:auto; bottom:calc(100% + 3px); }
  .actpt.lbleft .lb { left:-6px; transform:none; }
  .actpt.done { background:#1d9e75; border-color:#1d9e75; animation:none; cursor:default;
                width:26px; height:26px; opacity:.9; pointer-events:none; }
  .actpt.done .n { color:#fff; font-size:12px; }
  .actpt.done .lb { color:#177a48; border-color:#9fd8b7; background:#e8f7ee; }
  .actpt.dim { opacity:.55; }
  /* 托盘前沿的确认牌（图内确认，不占底部按钮栏） */
  #trayConfirm { position:absolute; left:50%; top:78%; transform:translate(-50%,-50%);
                 background:#fff; border:2px solid #1d9e75; color:#177a48; border-radius:999px;
                 padding:6px 15px; font-size:12px; font-weight:700; white-space:nowrap; cursor:pointer;
                 z-index:9; box-shadow:0 4px 13px rgba(20,40,30,.28); animation:ptPulse 1.9s ease-in-out infinite; }
  #trayConfirm b { color:#d1830c; font-weight:800; }
  #trayConfirm.ready { background:#1d9e75; border-color:#1d9e75; color:#fff; }
  #trayConfirm.ready b { color:#ffd76e; }
  #trayConfirm:active { transform:translate(-50%,-50%) scale(.95); }
  /* ---- 底部动作按钮栏：当全部动作都在图内完成时收起，画面随之变高 ---- */
  #stage.noacts #acts { display:none; }
  #stage.noacts #scene { bottom:70px; }
  #envProgress { position:absolute; left:10px; top:40px; font-size:11px; color:#33404f;
                 background:rgba(255,255,255,.92); border:1px solid #d8dde4; border-radius:8px; padding:3px 9px; }
  #envProgress b { color:#d1830c; }
  #envProgress.done b { color:#177a48; }
  .mark { position:absolute; width:26px; height:26px; border-radius:50%;
          background:rgba(229,57,53,.85); border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.35);
          transform:translate(-50%,-50%) scale(0); transition:transform .4s; }
  .mark.show { transform:translate(-50%,-50%) scale(1); }
  .mark.aid { background:rgba(30,136,229,.85); }
  .cap { position:absolute; font-size:11px; color:#33404f; background:rgba(255,255,255,.92);
         border:1px solid #c9ced6; border-radius:6px; padding:2px 7px; white-space:nowrap;
         transform:translate(-50%,0); opacity:0; transition:opacity .4s; }
  .cap.show { opacity:1; }
  #tagCard { position:absolute; left:38%; top:12%; width:56%; min-width:104px; max-width:150px;
             background:#fff8e0; border:1px solid #d9b64a;
             border-radius:8px; padding:5px 7px; font-size:10.5px; color:#6b5312; line-height:1.45;
             box-shadow:0 3px 10px rgba(0,0,0,.15); opacity:0; transform:rotate(6deg) scale(.7); transition:.5s; }
  #tagCard.show { opacity:1; transform:rotate(6deg) scale(1); }
  #heartLine { position:absolute; left:0; right:0; height:0; border-top:2px dashed #e5537a; opacity:0; transition:.5s; }
  #heartLine.show { opacity:.9; }
  #heartLine .hl-label { position:absolute; right:6px; top:-16px; font-size:11px; color:#c2335a; font-weight:600; }
  #raiseClock { position:absolute; right:10px; top:56px; background:rgba(28,34,44,.9); color:#fff;
                border-radius:8px; padding:6px 10px; font-size:12px; opacity:0; transition:.5s; }
  #raiseClock.show { opacity:1; }
  #raiseClock b { color:#ffd76e; }
  /* S3/S4/S10 肢体特写：手臂从左边缘伸入，根部落到画面外，避免断臂悬空 */
  .limbStage { position:absolute; inset:0; overflow:hidden; }
  .limbPhoto { position:absolute; height:64%; width:auto; top:18%; left:-6%;
               transform-origin:left center; filter:drop-shadow(0 4px 10px rgba(0,0,0,.10)); }
  /* S4 上臂止血：整条手臂左移，让近端(肱动脉)进画面，手被推出左侧 */
  .limbPhoto.upper { left:-52%; }
  /* S4 手臂等大定位容器：手套/按压点按手臂原图 1152×768 坐标定位，永远贴胳膊 */
  #limbFrame { position:absolute; }
  #limbFrame .limbPhoto { position:absolute; inset:0; width:100%; height:100%; top:auto; left:auto; }
  .glovePress { position:absolute; width:15%; height:auto; opacity:0; transition:opacity .4s, transform .4s;
                transform:translate(-50%,-50%) rotate(8deg); pointer-events:none; filter:drop-shadow(0 3px 6px rgba(0,0,0,.2)); }
  .glovePress.show { opacity:1; }
  .pressSpot { position:absolute; width:18px; height:18px; border-radius:50%; border:3px solid #fff;
               background:rgba(229,57,53,.9); box-shadow:0 2px 8px rgba(0,0,0,.35);
               transform:translate(-50%,-50%) scale(0); transition:transform .4s; }
  .pressSpot.show { transform:translate(-50%,-50%) scale(1); }
  .pressSpot.aid { background:rgba(30,136,229,.9); }
  .hLine { position:absolute; left:0; right:0; height:0; border-top:2px dashed #e5537a; opacity:0; transition:.5s; }
  .hLine.show { opacity:.9; }
  .hLine .hl-tag { position:absolute; left:8px; top:-17px; font-size:11px; color:#c2335a; font-weight:600;
                   background:rgba(255,255,255,.85); border-radius:5px; padding:1px 5px; }
  .hArrow { position:absolute; width:2px; background:#e5537a; opacity:0; transition:.5s; }
  .hArrow::after { content:""; position:absolute; top:-1px; left:-4px; border-left:5px solid transparent;
                   border-right:5px solid transparent; border-bottom:8px solid #e5537a; }
  .hArrow.show { opacity:.9; }
  .liftTag { position:absolute; font-size:11px; color:#c2335a; font-weight:600; opacity:0; transition:.5s;
             background:rgba(255,255,255,.9); border:1px solid #f0b8c8; border-radius:6px; padding:2px 7px; }
  .liftTag.show { opacity:1; }
  /* 物品选择 —— 医生不锈钢托盘 */
  #supplyWrap { position:absolute; inset:0; display:none; flex-direction:column; }
  #supplyWrap.show { display:flex; }
  #supplyImg { flex:1 1 auto; position:relative; margin:6px 8px; overflow:hidden;
               background:radial-gradient(ellipse at 50% 30%,#f4f6f8 0%,#e5e9ee 70%,#d9dee5 100%);
               border-radius:10px; border:1px solid #d8dde4;
               display:flex; align-items:center; justify-content:center; }
  /* 不锈钢托盘本体：拉丝金属渐变 + 立体卷边 + 内腔阴影 */
  #tray { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
          width:92%; height:80%;
          border-radius:18px;
          background:
            linear-gradient(135deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,0) 22%,rgba(0,0,0,.05) 55%,rgba(255,255,255,.5) 78%,rgba(0,0,0,.04) 100%),
            repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0px,rgba(255,255,255,.10) 1px,rgba(120,132,145,.06) 2px,rgba(120,132,145,.06) 3px),
            linear-gradient(160deg,#fefefe 0%,#d7dde3 14%,#eef2f5 30%,#c3cad2 50%,#e8edf1 70%,#b9c1ca 88%,#e3e8ed 100%);
          box-shadow:
            0 10px 22px rgba(40,52,66,.28),
            inset 0 2px 2px rgba(255,255,255,.95),
            inset 0 -3px 5px rgba(70,82,96,.28),
            inset 3px 0 5px rgba(255,255,255,.5),
            inset -3px 0 5px rgba(70,82,96,.18);
          border:2px solid #aeb7c1; }
  /* 托盘内腔（凹下去的盛放区） */
  #trayWell { position:absolute; inset:5% 4%; border-radius:11px;
              background:linear-gradient(155deg,#eef1f4 0%,#dfe4e9 40%,#e9edf1 62%,#d4dae1 100%);
              box-shadow:inset 0 3px 7px rgba(60,72,86,.22), inset 0 -1px 1px rgba(255,255,255,.8);
              border:1px solid rgba(150,162,175,.45); }
  /* 每件器材：在托盘内按百分比定位 */
  .tool { position:absolute; transform:translate(-50%,-50%); transition:transform .28s cubic-bezier(.2,.8,.3,1), filter .28s;
          cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .tool img { display:block; width:100%; height:auto; filter:drop-shadow(0 3px 3px rgba(30,40,52,.28)); }
  .tool.picked { transform:translate(-50%,-50%) scale(1.18) translateY(-10px); z-index:6;
                 filter:drop-shadow(0 10px 10px rgba(30,40,52,.4)); }
  .tool.note::after { content:attr(data-note); position:absolute; left:50%; top:-20px; transform:translateX(-50%);
                      white-space:nowrap; font-size:10px; color:#177a48; background:rgba(232,247,238,.95);
                      border:1px solid #9fd8b7; border-radius:6px; padding:1px 6px; opacity:0; transition:.25s; }
  .tool.picked.note::after { opacity:1; }
  .tool .tick { position:absolute; right:-6px; top:-6px; width:19px; height:19px; border-radius:50%;
                background:#1d9e75; color:#fff; font-size:12px; line-height:19px; text-align:center;
                box-shadow:0 1px 4px rgba(0,0,0,.25); opacity:0; transform:scale(.5); transition:.2s; }
  .tool.picked .tick { opacity:1; transform:scale(1); }
  .tool.wrong .tick { background:#d43a30; }
  /* 白手：从画面右上伸进来"拿起"器材，动作结束回位 */
  #pickHand { position:absolute; left:0; top:0; width:24%; z-index:9; pointer-events:none;
              transform-origin:74% 18%;
              opacity:0; transform:translate(40px,-60px) rotate(20deg);
              filter:drop-shadow(0 6px 8px rgba(30,40,52,.35)); }
  #pickHand.reach { animation:handReach .85s cubic-bezier(.3,.7,.3,1) forwards; }
  @keyframes handReach {
    0%   { opacity:0; transform:translate(40px,-60px) rotate(20deg); }
    35%  { opacity:1; transform:translate(0,0) rotate(0deg); }
    62%  { opacity:1; transform:translate(0,0) rotate(0deg); }
    100% { opacity:0; transform:translate(30px,-46px) rotate(14deg); }
  }
  /* 手臂图等大定位容器：交互点按 1152×768 原图坐标定位 */
  #armFrame { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
              transition:transform .65s cubic-bezier(.3,.7,.3,1); }
  #armFrame.lifted { transform:translate(-50%,-50%) translateY(-13%) rotate(2.5deg); }
  #armFrame .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
  /* S5 假人图等大容器：衬垫/止血带按假人原图 318×890 坐标定位，贴在右上臂 */
  #bodyFrame { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  #bodyFrame .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
  /* S11 转运：仰卧假人平躺在担架上，整理衣物/固定带/伤情报告三个图内交互点 */
  #finalPad { position:absolute; border-radius:18px;
              background:linear-gradient(168deg,#f2f6f9 0%,#e0e8ef 40%,#ebf1f5 62%,#d2dce5 100%);
              border:2px solid #c3ced8;
              box-shadow:0 14px 28px rgba(38,50,64,.22),
                         inset 0 2px 2px rgba(255,255,255,.92),
                         inset 0 -3px 6px rgba(70,84,98,.16); }
  #finalPad::before, #finalPad::after { content:""; position:absolute; left:-1.2%; right:-1.2%; height:7px;
              border-radius:99px; background:linear-gradient(180deg,#eef2f5,#b3bec9 55%,#8e99a5);
              box-shadow:0 2px 5px rgba(30,40,52,.28); }
  #finalPad::before { top:-10px; }
  #finalPad::after  { bottom:-10px; }
  /* S5 衬垫/止血带：贴着上臂的卷与带（不用透明描边框，避免"浮在衣服上的卡片"） */
  #bodyFrame .padRoll { border-radius:5px;
    background:linear-gradient(180deg,#ffffff 0%,#f7f5ee 52%,#dcd7c9 100%);
    box-shadow:0 1px 3px rgba(20,30,40,.30), inset 0 0 0 1px rgba(186,180,166,.95); }
  #bodyFrame .tqRoll { border-radius:5px;
    background:linear-gradient(180deg,#5d92d8 0%,#2a5cae 45%,#18396f 100%);
    box-shadow:0 1px 3px rgba(10,20,40,.38), inset 0 1px 0 rgba(255,255,255,.38); }
  #bodyFrame .tqRoll::after { content:""; position:absolute; right:-16%; top:20%; width:24%; height:60%;
    border-radius:2px; background:linear-gradient(180deg,#d5dee7,#8d9aa8);
    box-shadow:0 1px 2px rgba(0,0,0,.4); }
  #finalFrame { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:3; }
  #finalFrame .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
  #finalFrame .actpt { width:29px; height:29px; }
  #finalFrame .actpt.done { width:23px; height:23px; }
  #finalFrame .actpt .n { font-size:12px; }
  #finalFrame .actpt .lb { font-size:9.5px; padding:1px 5px; }
  .strap { position:absolute; border-radius:3px; opacity:0; transition:opacity .45s; width:4% !important;
           background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 3px,rgba(0,0,0,.07) 3px 6px),
                      linear-gradient(90deg,#1f2b3a,#3d5570 46%,#1a2432);
           box-shadow:0 1px 4px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.10); }
  .strap.show { opacity:.97; }
  .strap::before, .strap::after { content:""; position:absolute; left:50%; transform:translateX(-50%);
                  width:136%; height:4px; border-radius:2px;
                  background:linear-gradient(180deg,#e2e8ee,#9daab7 60%,#6f7c89);
                  box-shadow:0 1px 2px rgba(0,0,0,.45); }
  .strap::before { top:-2px; }
  .strap::after  { bottom:-2px; }
  #repNote { position:absolute; right:4%; top:44px; width:58%; background:#fffdf3; border:1px solid #d9c37a;
             border-radius:9px; padding:6px 8px; font-size:10px; line-height:1.55; color:#5c4a12;
             box-shadow:0 4px 12px rgba(0,0,0,.16); opacity:0; transform:scale(.88); transition:.4s; z-index:11; }
  #repNote.show { opacity:1; transform:scale(1); }
  #repNote b { color:#8a6d10; font-size:10.5px; }
  /* 点选只在物品角打一个小对勾，不用大框大底色 */
  .hot { position:absolute; width:16%; height:30%; border-radius:8px;
         transform:translate(-50%,-50%); transition:.2s; cursor:pointer; }
  .hot::after { content:""; position:absolute; right:-7px; top:-7px; width:21px; height:21px;
                border-radius:50%; background:#1d9e75; color:#fff; font-size:13px; line-height:21px;
                text-align:center; opacity:0; transform:scale(.6); transition:.18s;
                box-shadow:0 1px 4px rgba(0,0,0,.22); }
  .hot.sel::after { content:"✓"; opacity:1; transform:scale(1); }
