<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="XrGqEbMNsY2ZkRRdcYrT02">
<head data-page-node-id="OORZT5SBidCTST09rKPrq4">
<meta charset="UTF-8" data-page-node-id="TuG9Hlda2JzhuOm7wn6R21">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" data-page-node-id="8TpjVX5q1TEwd81fyOvAS8">
<title>科目四 · 单人徒手心肺复苏训练</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; -webkit-user-drag:none; touch-action:manipulation; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#fbfcfe; color:#e8eef7; display:flex; flex-direction:column;
    width:100%; height:100vh; height:100dvh;
  }

  /* ===== 顶部：监视系统 ===== */
  #monitor {
    background:#060a12; border-bottom:1px solid #1b2a40; padding:8px 10px 6px;
  }
  .mon-top { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#7fa0c8; }
  .rec { display:flex; align-items:center; gap:5px; color:#ff5757; font-weight:600; }
  .rec i { width:8px; height:8px; border-radius:50%; background:#ff5757; animation:blink 1s infinite; display:inline-block; }
  @keyframes blink { 50%{opacity:.15} }
  #ecg { width:100%; height:64px; display:block; background:#04070c; border:1px solid #14243a; border-radius:4px; margin-top:6px; }
  .mon-bottom { display:flex; justify-content:space-between; margin-top:5px; font-size:11px; color:#5f7d9f; }
  .mon-bottom b { color:#cfe3ff; font-weight:600; }
  #score.bad { color:#ff6b6b; }

  /* ===== 中部：假人（B 版：竖屏竖躺 · 头朝上 · 完整可见） ===== */
  #scaleWrap { width:100%; height:100%; position:relative; }
  #stage { position:relative; overflow:hidden; background-color:#fbfcfe; background-image:linear-gradient(to right,#e9edf3 1px,transparent 1px),linear-gradient(to bottom,#e9edf3 1px,transparent 1px); background-size:40px 40px; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  svg#dummy { width:100%; height:100%; max-width:100%; position:relative; z-index:2; touch-action:none; }
  #clock.warn { color:#ff6b6b; animation: clockBlink .6s steps(2,start) infinite; font-weight:800; }
  @keyframes clockBlink { 50% { opacity:.25; } }
  /* 拍肩目标 */
  #shoulderZone { cursor:pointer; }
  #chestZone { cursor:pointer; }
  #headZone { cursor:pointer; }
  /* 按压视觉反馈：俯视下 = 胸廓整体下陷 */
  #chest-inner { transform-box:fill-box; transform-origin:50% 46%; transition:transform .09s ease-out; }
  .compressing #chest-inner { transform:scale(.93); }
  #pressGlow { opacity:0; transition:opacity .09s; }
  .compressing #pressGlow { opacity:.9; }
  /* 施救者的手 */
  .handSkin { fill:url(#handG); stroke:#a8703f; stroke-width:2.2; stroke-linejoin:round; }
  .handLine { fill:none; stroke:#a8703f; stroke-width:1.8; stroke-linecap:round; opacity:.75; }
  #pressHands, #pulseHand { transition:opacity .14s; display:none !important; }  /* 去掉手部图形：摸脉搏/按压都靠坐标交互，手画得太糙，直接隐藏 */
  /* 按压时双手跟着下沉：transform 加在 <use> 自身的 transform 之后，故需各自带原点 */
  /* transform-origin:0 0 = 手的局部原点（掌心），缩放即「手掌整体下压」 */
  #pressHands .handShape { transform-origin:0 0; transform-box:fill-box; transition:transform .09s ease-out; }
  .compressing #pressHands .handShape { transform:scale(.955); }
  /* 提示光圈 */
  .pulse-ring { animation:ringPulse 1.2s infinite; }
  @keyframes ringPulse { 0%{opacity:.9; r:30} 100%{opacity:0; r:54} }
  .zipRing { animation:zipPulse 1.2s infinite; }
  @keyframes zipPulse { 0%{opacity:.95; r:16} 100%{opacity:0; r:32} }
  .carotidRing { animation:carotidPulse 1.3s infinite; }
  @keyframes carotidPulse { 0%{opacity:.9; r:15} 100%{opacity:0; r:30} }
  .doneMark { opacity:.35 !important; }
  /* 可交互部位标记：淡入淡出 */
  #markShoulder, #markMouth, #markCarotid, #markZip, #labelChest, #labelCarotid { transition:opacity .2s; }

  /* ===== 按压反馈（手机端：反馈必须做在手指盖不住的范围） ===== */
  /* 实时深度标尺：放在舞台左侧，远离按压点，绝不被手指遮挡 */
  #depthMeter { position:absolute; left:8px; top:50%; transform:translateY(-50%); width:34px; height:48%; z-index:6;
    background:rgba(4,10,18,.62); border:1px solid #1b2a40; border-radius:9px; overflow:hidden; display:none; pointer-events:none; }
  #depthFill { position:absolute; left:0; right:0; bottom:0; height:0%; background:linear-gradient(0deg,#2f9e6e,#4cc2ff); transition:height .04s linear; }
  #depthOk { position:absolute; left:0; right:0; bottom:62.5%; height:12.5%;
    background:rgba(143,227,176,.30); border-top:1.5px solid rgba(143,227,176,.75); border-bottom:1.5px solid rgba(143,227,176,.75); }
  #depthTxt { position:absolute; left:0; right:0; bottom:1px; text-align:center; font-size:11px; font-weight:800;
    color:#cfe3ff; font-variant-numeric:tabular-nums; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  #depthScale { position:absolute; right:2px; top:0; bottom:0; width:12px; font-size:8px; color:#5f7d9f;
    display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end; padding:2px 0; pointer-events:none; }
  /* 按压次数大字（屏幕上方，避开手指） */
  #cprCount { position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:7; font-size:28px; font-weight:800;
    color:#ffd166; text-shadow:0 2px 10px rgba(0,0,0,.8); opacity:0; transition:opacity .2s; pointer-events:none; font-variant-numeric:tabular-nums; }
  #cprCount.show { opacity:1; }
  /* 按压时双手略下沉 + 受力变暗，强化「陷下去」的视觉 */
  .compressing #pressHands .handShape { transform:scale(.94); }
  .compressing #pressHands { filter:brightness(.9); }
  #pressSink { transform-box:fill-box; transform-origin:50% 50%; transition:opacity .18s; }
  #pressRing { transition:stroke .1s; }
  /* 训练定位说明（开考前显示，开始后隐藏） */
  #trainTip { position:absolute; left:8px; right:8px; top:6px; z-index:8; text-align:center; font-size:10.5px; line-height:1.4;
    color:#9fb6d0; background:rgba(4,10,18,.64); border:1px solid #1b2a40; border-radius:8px; padding:5px 8px; }

  /* ===== 坐标标定工具（环境看不到图，靠用户在图上点出精确坐标） ===== */
  #calibPanel { position:fixed; right:10px; top:10px; width:212px; z-index:40; display:none;
    background:rgba(10,18,32,.94); border:1px solid #2f4a6b; border-radius:10px; padding:10px;
    font-size:12px; color:#cfe0f0; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  #calibPanel.on { display:block; }
  .calibHead { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; cursor:move; user-select:none; }
  .calibHead b { color:#ffd166; font-size:13px; }
  #calibProgress { color:#8fe3b0; font-weight:700; }
  .calibTip { color:#7fa0c0; font-size:11px; line-height:1.4; margin-bottom:6px; }
  .calibItem { display:flex; align-items:center; gap:6px; padding:4px 6px; margin:2px 0;
    border-radius:5px; cursor:pointer; user-select:none; }
  .calibItem:hover { background:#16283e; }
  .calibItem.sel { background:#1d4a6b; color:#fff; }
  .calibItem.done { color:#8fe3b0; }
  .calibItem .dot { width:9px; height:9px; border-radius:50%; border:1.5px solid currentColor; flex:none; }
  .calibItem.done .dot { background:#8fe3b0; border-color:#8fe3b0; }
  .calibItem .cv { margin-left:auto; font-size:10px; color:#5f83a5; font-variant-numeric:tabular-nums; }
  .calibRow { display:flex; gap:6px; margin-top:8px; }
  .calibBtn { flex:1; padding:5px 0; font-size:11px; border-radius:6px; cursor:pointer;
    background:#1d4a6b; color:#dff0ff; border:1px solid #2f6a95; }
  .calibBtn.warn { background:#5a2230; border-color:#8a3348; color:#ffd7dd; }
  #calibOut { width:100%; height:70px; margin-top:6px; font-size:10px; line-height:1.35;
    background:#0b1524; color:#8fe3b0; border:1px solid #2f4a6b; border-radius:6px;
    padding:5px; resize:none; font-family:monospace; }
  #calibToggle { position:absolute; right:10px; bottom:10px; z-index:41; padding:5px 11px;
    font-size:11px; border-radius:6px; cursor:pointer; background:rgba(29,74,107,.9);
    color:#dff0ff; border:1px solid #2f6a95; }
  #lockBtn { position:absolute; right:70px; bottom:10px; z-index:41; padding:5px 11px;
    font-size:11px; border-radius:6px; cursor:pointer; background:rgba(96,74,20,.92);
    color:#ffe9c0; border:1px solid #9a7a35; }
  #modeBtn { position:absolute; left:10px; bottom:10px; z-index:41; padding:5px 11px;
    font-size:11px; border-radius:6px; cursor:pointer; background:rgba(29,74,107,.9);
    color:#dff0ff; border:1px solid #2f6a95; }
  /* 正式模式隐藏调试键；?cprdebug=1 调试模式显示 */
  #calibToggle { display:none !important; }  /* v5: 锁定键默认可见，拖动+锁定作摆位兜底；标定键仍隐藏(防交互点偏移) */
  body.cprdebug #calibToggle, body.cprdebug #lockBtn { display:block !important; }
  #calibCoord { position:absolute; left:10px; top:10px; z-index:40; display:none;
    padding:4px 9px; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;
    background:rgba(10,18,32,.9); color:#ffd166; border:1px solid #2f4a6b; border-radius:6px; }
  #calibCoord.on { display:block; }
  /* 标定模式下让所有热区显形，方便对照位置 */
  body.calib #hotzones [fill="transparent"] { fill:rgba(255,209,102,.14); stroke:#ffd166; stroke-width:2; }
  /* 当前该点的交互热区：常显黄色半透明，让考生一眼看到可点范围（也便于定位双肩点不到的问题） */
  #hotzones .active [fill="transparent"] { fill:rgba(255,209,102,.16); stroke:#ffd166; stroke-width:2; }
  /* 标定模式：捕获层接管全图点击（盖在底图/装饰之上，确保坐标精确，不被遮挡） */
  body.calib #calibCapture { pointer-events:auto; }
  /* 待标定点闪烁，提醒「该点这里」 */
  @keyframes calibPulse { 0%,100%{ stroke-opacity:1; } 50%{ stroke-opacity:.2; } }
  .calibPulse { animation: calibPulse 1s ease-in-out infinite; }

  /* 提示浮字：竖屏下由 JS 动态放到监视器正下方（监视器与假人之间的空隙），并跟随监视器移动 */
  #floatTip { position:absolute; left:50%; top:18%; transform:translateX(-50%); font-size:15px; font-weight:700;
    color:#4cc2ff; text-shadow:0 1px 6px rgba(0,0,0,.8); opacity:0; transition:opacity .25s; pointer-events:none; z-index:45;
    white-space:normal; text-align:center; max-width:92%; }
  #floatTip.show { opacity:1; }

  /* ===== 状态栏（当前步骤 / 进度） ===== */
  #statusBar { background:#0e1a2e; border-top:1px solid #1b2a40; padding:8px 12px; }
  #stepTitle { font-size:14px; font-weight:700; color:#ffd166; margin-bottom:4px; display:flex; justify-content:space-between; }
  #stepTitle small { color:#7fa0c8; font-weight:400; font-size:12px; }
  #progress { height:6px; background:#16263e; border-radius:3px; overflow:hidden; }
  #progressBar { height:100%; width:0%; background:linear-gradient(90deg,#2f9e6e,#4cc2ff); transition:width .3s; }

  /* ===== 底部操作区 ===== */
  #actions { padding:10px 12px calc(12px + env(safe-area-inset-bottom)); background:#0a1322; display:flex; gap:8px; justify-content:center; }
  .btn {
    flex:1; max-width:150px; padding:13px 8px; border:none; border-radius:10px; font-size:15px; font-weight:700;
    background:linear-gradient(180deg,#2c4a75,#20365a); color:#eaf3ff; box-shadow:0 3px 0 #16243d; cursor:pointer;
  }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 #16243d; }
  .btn.warn { background:linear-gradient(180deg,#8a4b2c,#6e3a22); box-shadow:0 3px 0 #4a2717; }
  .btn.ok { background:linear-gradient(180deg,#2c7550,#225840); box-shadow:0 3px 0 #173a29; }
  .btn:disabled { opacity:.35; pointer-events:none; }
  /* 当前该点的主操作按钮：呼吸高亮，一眼找到入口（禁用时自动不亮） */
  @keyframes btnPulse { 0%,100%{ box-shadow:0 3px 0 #16243d, 0 0 0 0 rgba(255,209,102,.7); } 70%{ box-shadow:0 3px 0 #16243d, 0 0 0 10px rgba(255,209,102,0); } }
  #btnA:not(:disabled){ animation:btnPulse 1.5s ease-out infinite; }

  /* ===== 事件日志（监视系统） ===== */
  /* 操作记录并入考核主机屏内（监视器屏幕底部滚动区） */
  #log { width:100%; margin-top:4px; height:72px; flex:none; overflow:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; justify-content:flex-start; pointer-events:none; }
  #log:empty { display:none; }
  .log-item { font-size:10.5px; line-height:1.5; color:#9fd0a8; background:rgba(4,10,18,.72); border-left:2px solid #2c7550;
    padding:2px 6px; margin-top:3px; border-radius:2px; animation:slideIn .25s; }
  .log-item.err { color:#ffb0b0; border-left-color:#b23b3b; }
  @keyframes slideIn { from{transform:translateX(14px);opacity:0} }
  /* 调试/位置信息：显示监视器和假人的当前位置，方便真机调好后复制发回固化 */
  #posInfo { position:absolute; left:8px; top:8px; z-index:50; max-width:260px; padding:6px 9px; font-size:11px; line-height:1.5;
    color:#fff; background:rgba(10,18,32,.82); border:1px solid #2f4a6b; border-radius:8px; white-space:pre-wrap; word-break:break-all;
    user-select:text; -webkit-user-select:text; pointer-events:auto; }

  #posInfo:empty { display:none; }

  /* ===== 选词题：考察「该说什么」（3选1） ===== */
  #quizMask { position:fixed; inset:0; background:rgba(3,7,13,.86); z-index:98; display:none;
    flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  #quizMask.show { display:flex; }
  #quizBox { width:100%; max-width:420px; background:#0e1a2e; border:1px solid #1b2a40; border-radius:12px; padding:16px 14px 12px; }
  #quizQ { font-size:15px; font-weight:700; color:#eaf3ff; margin-bottom:6px; line-height:1.5; }
  #quizSub { font-size:12px; color:#8aa6c8; margin-bottom:10px; }
  .quizOpt { display:block; width:100%; margin:8px 0; padding:12px; text-align:left; font-size:14px; line-height:1.5;
    background:#13243d; color:#dce8f7; border:1px solid #24405f; border-radius:8px; cursor:pointer; }
  .quizOpt:active { background:#1b3555; }
  #quizFb { font-size:13px; margin-top:6px; min-height:22px; line-height:1.6; }

  /* ===== 结果页 ===== */
  #resultMask { position:fixed; inset:0; background:rgba(3,7,13,.92); z-index:99; display:none;
    flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  #resultMask.show { display:flex; }
  #resultScore { font-size:56px; font-weight:800; color:#4cc2ff; }
  #resultGrade { font-size:20px; font-weight:700; margin:4px 0 14px; }
  #resultDetail { width:100%; max-width:420px; background:#0e1a2e; border:1px solid #1b2a40; border-radius:10px; padding:12px 14px; font-size:13px; color:#a9c4e4; line-height:1.9; max-height:44vh; max-height:44dvh; overflow:auto; }
  #resultDetail .err { color:#ff9a9a; }
  #resultDetail .ok { color:#8fe3b0; }
  .rebtn { margin-top:16px; padding:12px 44px; border:none; border-radius:10px; font-size:16px; font-weight:700;
    background:linear-gradient(180deg,#2c7550,#225840); color:#fff; box-shadow:0 3px 0 #173a29; }

  /* ===== 考核主机（画布可拖仪器 · 屏幕内为考核界面） ===== */
  #device{ position:absolute; right:10px; top:8px; width:min(60%,340px); z-index:30; filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));
    transform:scale(.5); transform-origin:top right; }
  /* 手机竖屏（横躺版）：考核主机放大+水平居中 —— 学员反映看不清、且不要偏一侧（T 字构图：
     主机居中在上、假人居中在下）。left:0+right:0+margin:auto 居中，不干扰拖动（拖动改 left） */
  @media (max-width:768px) and (orientation:portrait){
    #device{ left:0; right:0; margin:0 auto; top:8px; width:min(88%,440px); transform:scale(.9); transform-origin:top center; }
  }
  /* 手机横屏：假人按高度铺满，主机缩小避让，防止盖住拉链操作区 */
  @media (orientation:landscape) and (max-height:520px){
    #device{ left:auto; margin:0; width:min(34%,280px); transform:scale(.55); }
  }
  /* 手机竖屏：考核主机放大，保证屏幕上倒计时/次数/波形看得清
     （必须写在 #device 之后 —— 同权重规则后定义者胜，写前面会被覆盖失效） */
  /* ---- 竖躺模式：由「竖躺」按钮切换（body.vmode），不再随竖屏自动触发 ----
     假人竖躺占满全高，上半身全是交互区；仪器挪到下方腿部空白区，不遮热区 */
  /* 竖躺时右下角被仪器占据，锁定键移到左下角，与「竖躺」键并排；
     仪器回右下角（显式清掉横躺版居中的 left/margin） */
  body.vmode #device{ left:auto; right:2%; margin:0; top:auto; bottom:1.5%; width:min(74%,380px); transform:scale(.72); transform-origin:bottom right; }
  body.vmode #trainTip{ right:40%; }
  body.vmode #stage { overflow:visible; }
  body.vmode svg#dummy { transform:scale(1); transform-origin:center center; }
  /* 竖躺时右下角被仪器占据，锁定键移到左下角，与「竖躺」键并排 */
  body.vmode #lockBtn{ left:82px; right:auto; }
  #devHandle{ background:#1f2733; color:#9fb4cf; font-size:12px; text-align:center; padding:2px 0; border-radius:8px 8px 0 0; cursor:grab; user-select:none; letter-spacing:8px; touch-action:none; }
  #devHandle:active{ cursor:grabbing; }
  #devScreen{ background:linear-gradient(180deg,#54b9f5,#3fa4e8); border:6px solid #16202e; border-radius:10px; padding:6px 7px; color:#fff; height:452px; display:flex; flex-direction:column; overflow:hidden; }
  .dev-head{ display:flex; justify-content:space-between; align-items:center; gap:6px; flex:none; }
  .dev-title{ font-size:13px; font-weight:800; text-shadow:0 1px 2px rgba(0,30,60,.4); }
  .dev-clock{ font-size:11px; background:rgba(10,40,70,.45); padding:2px 7px; border-radius:6px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .dev-tip{ font-size:10.5px; line-height:1.5; margin:5px 0; background:rgba(255,255,255,.14); border-radius:6px; padding:4px 7px; height:auto; min-height:44px; max-height:60px; flex:none; overflow:hidden; }
.dev-tip #stepTitle{ margin-bottom:0; }
  .dev-tip b{ color:#ffe08a; }
  .dev-panels{ display:flex; gap:7px; height:204px; flex:none; overflow:hidden; }
  .dev-left,.dev-right{ flex:1; background:#2f9be0; border-radius:8px; padding:6px 7px; min-width:0; display:flex; flex-direction:column; gap:7px; justify-content:flex-start; }
  #devScreen #depthMeter{ position:relative !important; inset:auto !important; transform:none !important; width:34px !important; height:82px !important; margin:0 auto; }
  #devScreen #cprCount{ position:static !important; left:auto !important; top:auto !important; transform:none !important; font-size:15px !important; text-align:center; color:#fff; }
  .dev-counts{ font-size:11px; line-height:1.7; margin-top:0; }
  .dev-counts b{ color:#ffe08a; font-size:13px; }
  .dev-pos{ font-size:10.5px; text-align:center; }
  .dev-pos .dots{ display:grid; grid-template-columns:repeat(3,16px); gap:4px; justify-content:center; margin:5px 0; }
  .dev-pos .dots i{ width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.85); }
  .dev-pos .dots i:nth-child(1){ grid-column:2; grid-row:1; }

<script>
/* __BACKBTN__ : iframe 内的返回按钮，向父页面 postMessage */
(function(){
  'use strict';
  if (window.top === window.self) return;   /* 不在 iframe 里就不显示 */
  function install(){
    if (document.getElementById('__backFab')) return;
    var b = document.createElement('button');
    b.id = '__backFab';
    b.textContent = '‹ 返回';
    b.style.cssText = [
      'position:fixed','left:8px','top:8px','z-index:2147483000',
      'background:rgba(24,95,165,.92)','color:#fff','border:none','border-radius:16px',

    b.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      try { parent.postMessage({ __dshBack: true }, '*'); } catch(err){}
    });
    document.body.appendChild(b);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', install);
  } else {
    install();
  }
  /* 有些页面会重绘 body，兜住 */
  setTimeout(install, 1200);
})();
</script>
