html,body{width:100%;height:100%;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#1a252f;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}

.nudge-panel{display:none;position:fixed;z-index:300;background:rgba(0,0,0,0.9);border-radius:8px;padding:5px;color:#fff;font-size:9px;font-family:monospace;top:4px;right:4px;width:250px;}
body.debug .nudge-panel{display:block}
.nudge-panel .nr{display:flex;align-items:center;gap:2px;margin:1px 0;flex-wrap:wrap}
.nudge-panel .nl{color:#aaa;width:24px;text-align:right;font-size:8px}
.nudge-panel .nv{color:#0f0;width:22px;text-align:center;font-size:8px}
.nudge-panel button{width:18px;height:18px;border:none;border-radius:3px;background:#333;color:#fff;font-size:11px;font-weight:bold;cursor:pointer;line-height:1}
.nudge-panel button:active{background:#555}
.nudge-panel .sec{color:#ff0;font-size:8px;width:28px;margin-right:4px}
.nudge-btn{display:none}
.nudge-btn.on{background:rgba(0,128,0,0.8)}
.info-panel{position:absolute;z-index:55;display:flex;flex-direction:column;gap:2px;}
.info-title{font-weight:700;font-size:16px;color:#333;}
.info-target{font-size:14px;color:#333;}
.info-target span{color:#1677ff;font-weight:600;}
.clamp-wrap{position:absolute;width:50%;z-index:10}
.clamp-wrap .mbg{width:100%;display:block;position:relative;pointer-events:none}
.lcd{position:absolute;top:14%;left:18%;width:64%;height:15%;z-index:15;padding:0 2px;border-radius:2px;background:linear-gradient(to bottom,#ddeef4,#cee8f2);box-shadow:inset 0 0 4px #f3feff;display:flex;flex-direction:column}
.lcd-t{display:flex;justify-content:space-between;align-items:center;height:18%}
.lcd-ti{width:18%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lcd-ti img{max-width:100%;max-height:100%;object-fit:contain}
.lcd-m{position:absolute;top:20%;left:0;bottom:20%;width:8%;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.lcd-mi{width:100%;height:40%;display:flex;align-items:center;justify-content:center}
.lcd-mi img{max-width:100%;max-height:100%;object-fit:contain}
.lcd-vw{flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:2px}
.lcd-v{font-family:'Digital7',monospace;font-size:clamp(18px,6vw,32px);color:#1a4a2a;text-shadow:0 0 3px rgba(26,74,42,0.6);text-align:right;line-height:1;overflow:hidden;white-space:nowrap}
.lcd-b{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:clamp(5px,1.8vw,9px);font-weight:700;color:#1a4a2a}
.knob-wrap{position:absolute;top:54%;left:60%;transform:translate(-50%,-50%);width:18%;z-index:20}
.knob-wrap img{width:100%;height:100%;object-fit:contain;transform-origin:center center}
/* 导线 */
.wire-area{position:absolute;z-index:25;display:flex;flex-direction:column;align-items:center;gap:4px;}
.wire-line{width:120px;height:8px;background:#888;border-radius:4px;}
.wire-lbl{font-size:10px;font-weight:600;color:#555;}
.wire-hl{border-color:#ff4444;box-shadow:0 0 18px rgba(255,68,68,0.7);}
/* 钳口 */
.jaw-btn{position:absolute;z-index:50;}
.jaw-btn button{padding:8px 20px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:#ff9800;color:#fff;}
.jaw-btn button.open{background:#4caf50;}
.emp{display:flex;align-items:center;gap:4px;font-size:14px;color:#333;position:absolute;z-index:55;}
.emp .inp{width:70px;height:26px;border:1px solid #ccc;border-radius:4px;padding:2px 6px;font-size:12px;text-align:center;color:#333;}
.emp .inp:focus{outline:none;border-color:#1677ff;}
.acts{position:absolute;bottom:10px;left:6%;right:6%;z-index:50;display:flex;gap:6px;justify-content:center}
.acts button{flex:1;max-width:100px;padding:8px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer}
.acts .pri{background:#1677ff;color:#fff}
.acts .sec{background:#fff;color:#333;border:1px solid #ddd}
.acts .pri:disabled{background:#ccc}
.sel-cb{width:16px;height:16px;border:2px solid #999;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sel-cb.checked{background:#1677ff;border-color:#1677ff;}
.sel-cb.checked:after{content:'✓';color:#fff;font-size:10px;font-weight:bold;}
.toast{position:fixed;top:15%;left:50%;transform:translateX(-50%);z-index:200;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:600;color:#fff;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;white-space:pre-line}
.toast.show{opacity:1}
.toast.w{background:rgba(230,100,0,0.93)}
.toast.e{background:rgba(200,20,20,0.93)}
.toast.i{background:rgba(0,0,0,0.85)}
