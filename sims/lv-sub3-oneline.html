<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K32-01低压开关柜一次系统图(模拟屏图)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#c3c6bf;
}
/* === 视觉皮肤：银灰模拟屏 + 金属边框（参考高压科目三 hv-oneline） === */
#bar{
  position:fixed;top:14px;left:14px;right:14px;height:44px;z-index:45;
  display:flex;align-items:center;gap:6px;padding:0 12px;
  background:transparent;border:none;box-shadow:none;
}
#bar .tt{font-weight:900;color:#8B1A1A;letter-spacing:2px;font-size:15px;text-align:center;line-height:1.28;white-space:nowrap;flex-shrink:0;text-shadow:0 1px 0 rgba(255,255,255,.55)}
#bar .tt2{display:block;text-align:center;font-size:13px;letter-spacing:1px;opacity:.92}
#bar button{
  border:1px solid #8f9a8d;background:linear-gradient(180deg,#eceee6,#d6d9cd);color:#4a5044;border-radius:4px;
  width:28px;height:25px;font-size:15px;font-weight:700;cursor:pointer;line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 2px rgba(0,0,0,.12);
}
#bar button:hover{background:linear-gradient(180deg,#f2f4ec,#e0e3d7);border-color:#767f72}
#bar button.wide{width:auto;padding:0 7px;font-size:12px;font-weight:600}
#stage{position:fixed;top:58px;left:0;right:0;bottom:0;touch-action:none;
  background:#c3c6bf;
}
#stage svg{width:100%;height:100%;display:block;cursor:grab}
#stage svg:active{cursor:grabbing}
.alarm{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;
  display:none;z-index:20;max-width:90%;
}
.alarm.show{display:block;animation:fs .3s}
.alarm.err{background:rgba(192,57,43,.16);color:#a02015;border:1px solid rgba(192,57,43,.55)}
.alarm.ok{background:rgba(39,140,80,.16);color:#1c6e3c;border:1px solid rgba(39,140,80,.5)}
@keyframes fs{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#log{
  position:fixed;left:24px;bottom:14px;z-index:15;
  width:330px;max-height:240px;overflow:auto;
  background:rgba(226,228,219,.96);border:1px solid #8f9a8d;border-radius:6px;
  padding:8px 10px;color:#33372e;font-size:12px;line-height:1.55;
  display:none;box-shadow:0 4px 14px rgba(0,0,0,.3);
}
#log.show{display:block}
#log h4{font-size:12px;color:#5a6052;margin:0 0 6px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#log h4 button{border:1px solid #8f9a8d;background:#d6d9cd;color:#4a5044;border-radius:4px;width:24px;height:18px;font-size:11px;cursor:pointer;line-height:1}
#log h4 button:hover{background:#e4e6dd}
#log .row{margin:2px 0;padding:2px 0 2px 8px;border-left:2px solid #8B1A1A;word-break:break-all}
#log .row.hi{border-left-color:#b8860b}
#log .row .t{color:#7d8478;font-size:11px;margin-right:6px}
#log .empty{color:#8a9184;font-style:italic}
/* 金属边框：屏幕外圈铝合金斜面（与高压科目三同款，不挡交互） */
#bezel{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;pointer-events:none;
  border:14px solid #aab0b6;
  border-image:linear-gradient(135deg,
    #fdfefe 0%, #8b9095 16%, #e9ecef 38%, #6f7479 54%, #cfd3d7 76%, #fdfefe 100%) 1;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.95),
    inset 0 0 0 3px rgba(70,75,80,.85),
    inset 0 0 0 5px rgba(255,255,255,.45),
    inset 0 0 10px 6px rgba(0,0,0,.22);
}
/* 旋钮：金属圆座 + 黑手柄（与运行维护页同款渐变口径） */
.knob{cursor:pointer}
.knob .bezel{fill:url(#knobBez);stroke:#282d25;stroke-width:1}
.knob .handle{fill:url(#knobHdl);stroke:#0a0b0a;stroke-width:.7}
.knob .ind{fill:#eedee0}
.knob .opring{fill:none;stroke:#236a9d;stroke-width:2.4;opacity:0}
.knob .opring.on{opacity:1}
.knob text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;user-select:none}
</style>
</head>
<body>
<div id="bar">
  <span class="tt">K32-01低压开关柜一次系统图<br><span class="tt2">(模拟屏图)</span></span>
  <button id="zreset" class="wide" style="margin-left:auto" title="一键复位：设备归零 + 画面归正 + 清空操作记录">复位</button>
  <button id="logtoggle" class="wide" title="显示/隐藏操作记录">记录</button>
</div>
<div id="stage">
  <svg id="svg" viewBox="0 0 1402 1122" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="knobBez" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c6cabd"/>
        <stop offset=".55" stop-color="#7d8578"/>
        <stop offset="1" stop-color="#293128"/>
      </linearGradient>
      <linearGradient id="knobHdl" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#080e0b"/>
        <stop offset=".5" stop-color="#333c32"/>
        <stop offset="1" stop-color="#0c120e"/>
      </linearGradient>
      <mask id="inkMask">
        <image x="0" y="0" width="1402" height="1122" href="mimic-panel-compact-v5mask.png"/>
      </mask>
    </defs>
    <g id="vp">
      <g id="content">
        <!-- 0.4kV 低压配电模拟屏底图 v5（面板底色已压平为 rgb(195,198,191)，与页面背景完全同色） -->
        <image id="mimic" x="0" y="0" width="1402" height="1122" href="mimic-panel-compact-v5.png" preserveAspectRatio="xMidYMid meet"/>
        <!-- 带电光带：黄=带电 绿=合闸未带电（墨迹蒙版精确沿图上线条/符号点亮） -->
        <g id="live" mask="url(#inkMask)"></g>
        <!-- 410 刀闸（隔离开关）：面板色补丁盖住底图斜线（分态），按状态重绘 合=竖直 / 分=斜线 -->
        <g id="knife410"></g>
        <!-- 6 个可操作旋钮由脚本生成：401 / 410 / 411-1~4 -->
        <g id="knobs"></g>
      </g>
    </g>
  </svg>
</div>
<div id="al" class="alarm"></div>
<div id="log"><h4>操作记录<button id="logclose" title="收起">×</button></h4><div id="logbody"><div class="empty">暂无操作记录（点击图中旋钮即记录）</div></div></div>

<script>
/* __BACKBTN__ : iframe 内的返回按钮，向父页面 postMessage */
(function(){
  'use strict';
  if (window.top === window.self) return;   /* 不在 iframe 里就不显示 */
  function install(){
    if (document.getElementById('__backFab')) return;
    var b = document.createElement('button');
    b.id = '__backFab';
    b.textContent = '‹ 返回';
    b.style.cssText = [
      'position:fixed','left:8px','top:8px','z-index:2147483000',
      'background:rgba(24,95,165,.92)','color:#fff','border:none','border-radius:16px',
      'padding:7px 13px','font-size:13px','font-family:inherit','line-height:1.3',
      'box-shadow:0 2px 10px rgba(0,0,0,.28)','cursor:pointer','-webkit-tap-highlight-color:transparent'
    ].join(';');
    b.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      try { parent.postMessage({ __dshBack: true }, '*'); } catch(err){}
    });
    document.body.appendChild(b);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', install);
  } else {
    install();
  }
  /* 有些页面会重绘 body，兜住 */
  setTimeout(install, 1200);
})();
</script>
