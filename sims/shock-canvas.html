*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;font-family:PingFang SC,Microsoft YaHei,sans-serif;touch-action:none;overflow:hidden;font-size:14px}

.btn{border:none;border-radius:6px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;color:#fff}

.gesture-hint{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);color:#fff;padding:6px 14px;border-radius:8px;font-size:12px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}

.nudge-panel .nv{color:#0f0;font-size:9px;min-width:22px;text-align:center}
.nudge-panel button{width:20px;height:20px;border:none;border-radius:3px;background:#333;color:#fff;font-size:12px;font-weight:bold;cursor:pointer;line-height:1;flex-shrink:0}
.nudge-panel button:active{background:#555}
.nudge-panel .sec{color:#ff0;font-size:9px;min-width:50px}
.nudge-btn{position:fixed;z-index:999;left:12px;bottom:100px;width:52px;height:52px;border-radius:50%;background:#2e7d32;color:#fff;border:2px solid #4caf50;font-size:24px;font-weight:bold;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
