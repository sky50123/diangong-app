<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>K11-01 低压验电笔</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#1a252f;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.page{width:100%;height:100vh;position:relative;background:linear-gradient(180deg,#dfe7f8,#e8f0fb);overflow:hidden;max-width:500px;margin:0 auto;}

.meas-point{position:absolute;z-index:25;display:flex;flex-direction:column;align-items:center;gap:2px;}
.meas-dot{width:8px;height:8px;border-radius:50%;border:2px solid #999;background:rgba(255,255,255,0.4);}
.meas-dot.hl{border-color:#ff4444;box-shadow:0 0 10px rgba(255,68,68,0.8);transform:scale(1.3);}
.meas-dot.con{border-color:#44aa44;box-shadow:0 0 6px rgba(68,170,68,0.5);}
.meas-lbl{font-size:7px;font-weight:700;color:#555;}

.probe{position:absolute;z-index:35;pointer-events:auto;touch-action:none;cursor:pointer}
.probe img{display:block;pointer-events:none;width:70px;height:70px;object-fit:contain}
.probe .pl{font-size:9px;font-weight:600;color:#333;text-align:center;margin-top:2px}

.ctrl-panel{position:absolute;z-index:60;display:flex;flex-direction:column;gap:4px;font-size:13px;color:#333;background:rgba(255,255,255,0.95);padding:10px 12px;border-radius:8px;pointer-events:auto}
.judge-row{display:flex;gap:14px;margin-top:4px}
.judge-opt{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px}
.judge-opt input[type=radio]{accent-color:#1677ff;width:16px;height:16px}

.acts{position:absolute;bottom:10px;left:6%;right:6%;z-index:50;display:flex;gap:6px;justify-content:center}
.acts button{flex:1;max-width:100px;padding:8px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer}
.acts .pri{background:#1677ff;color:#fff}
.acts .sec{background:#fff;color:#333;border:1px solid #ddd}
.acts .pri:disabled{background:#ccc}

.toast{position:fixed;top:15%;left:50%;transform:translateX(-50%);z-index:200;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:600;color:#fff;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;white-space:pre-line}
.toast.show{opacity:1}
.toast.w{background:rgba(230,100,0,0.93)}
.toast.e{background:rgba(200,20,20,0.93)}
.toast.i{background:rgba(0,0,0,0.85)}

.nudge-panel{display:none;position:fixed;z-index:300;background:rgba(0,0,0,0.9);border-radius:8px;padding:5px;color:#fff;font-size:9px;font-family:monospace;top:4px;right:4px;width:260px;max-height:90vh;overflow-y:auto;}
body.debug .nudge-panel{display:block}
.nudge-panel .nr{display:flex;align-items:center;gap:2px;margin:1px 0;flex-wrap:wrap}
.nudge-panel .nl{color:#aaa;width:24px;text-align:right;font-size:8px}
.nudge-panel .nv{color:#0f0;width:26px;text-align:center;font-size:8px}
.nudge-panel button{width:18px;height:18px;border:none;border-radius:3px;background:#333;color:#fff;font-size:11px;font-weight:bold;cursor:pointer;line-height:1}
.nudge-panel button:active{background:#555}
.nudge-panel .sec{color:#ff0;font-size:8px;width:32px;margin-right:4px}
.nudge-btn{display:none}
.nudge-btn.on{background:rgba(0,128,0,0.8)}
</style>
</head>
<body>
<div class="page" id="page">

  <div style="position:absolute;top:3px;left:0;right:0;text-align:center;z-index:5;font-size:17px;font-weight:700;color:#1a3a5a;letter-spacing:1px;pointer-events:none">K11-01 低压验电笔测试插座</div>

  <!-- 插座图 -->
  <div id="outletArea" style="position:absolute;z-index:9;left:7%;top:27%;width:86%;">
    <img src="static/images/learn/YBDS-chazuo-wukong@3x.png" id="outletImg" style="width:100%;display:block">
  </div>

  <!-- L/N/PE测量点 -->
  <div class="meas-point" id="mpL1"><div class="meas-dot" id="mdL1"></div><div class="meas-lbl">L</div></div>
  <div class="meas-point" id="mpN1"><div class="meas-dot" id="mdN1"></div><div class="meas-lbl">N</div></div>
  <div class="meas-point" id="mpL2"><div class="meas-dot" id="mdL2"></div><div class="meas-lbl">L</div></div>
  <div class="meas-point" id="mpN2"><div class="meas-dot" id="mdN2"></div><div class="meas-lbl">N</div></div>
  <div class="meas-point" id="mpPE"><div class="meas-dot" id="mdPE"></div><div class="meas-lbl">PE</div></div>

  <!-- 两把验电笔：纯拖拽，和表笔一样 -->
  <div class="probe" id="penNeon">
    <img src="static/images/learn/YBDS-naiguanbi-off@3x.png">
    <div class="pl">氖管式</div>
  </div>
  <div class="probe" id="penDigital">
    <img src="static/images/learn/YBDS-shuzidianbi-duan@3x.png">
    <div class="pl">数字式</div>
  </div>

  <!-- 控制面板 -->
  <div class="ctrl-panel" id="ctrlPanel">
    <div>使用验电笔: <span id="examReq" style="font-weight:700;">—</span></div>
    <div>测试结果: <span id="testResult" style="font-weight:700;">—</span></div>
    <div class="judge-row">
      <label class="judge-opt"><input type="radio" name="judge" id="judgeLive" value="live"> 带电</label>
      <label class="judge-opt"><input type="radio" name="judge" id="judgeDead" value="dead"> 不带电</label>
    </div>
  </div>

  <div class="acts"><button class="sec" onclick="rstAll()">整理归位</button><button class="pri" id="subBtn" onclick="sub()">提交检测</button></div>
  <div class="toast" id="toast"></div>

    <div class="nr"><span class="sec">氖管</span><span class="nl">l</span><button onclick="nudgePen('neon','l',-5)">-</button><span class="nv" id="nv_nl">220</span><button onclick="nudgePen('neon','l',5)">+</button><span class="nl">t</span><button onclick="nudgePen('neon','t',-5)">-</button><span class="nv" id="nv_nt">112</span><button onclick="nudgePen('neon','t',5)">+</button><span class="nl">s</span><button onclick="nudgePenSz('neon',-1)">-</button><span class="nv" id="nv_ns">100</span><button onclick="nudgePenSz('neon',1)">+</button></div>
