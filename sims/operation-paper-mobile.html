<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>高压操作票</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f4f7; color: #1f2329;
    display: flex; flex-direction: column; overflow: hidden;
    height: 100vh; height: 100dvh;
  }
  .top {
    flex: none; background: #1f6feb; color: #fff;
    padding: calc(env(safe-area-inset-top) + 8px) 10px 8px;
  }
  .top h1 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
  .top .meta { font-size: 12px; opacity: .92; margin-top: 2px; }
  .bar { display: flex; gap: 8px; margin-top: 6px; }
  .bar button {
    flex: none; border: none; border-radius: 6px; padding: 5px 18px;
    font-size: 13px; font-weight: 600;
  }
  .bar .judge { background: #fff; color: #1f6feb; }
  .bar .reset { background: rgba(255,255,255,.22); color: #fff; }
  .bar .rand { background: #ffd866; color: #1f2329; }

  .bar2 { display: flex; margin-top: 6px; }
  .switcher {
    display: flex; gap: 6px; overflow-x: auto;
    flex: 1; min-width: 0; width: 100%; -webkit-overflow-scrolling: touch;
    padding: 2px 0;
  }
  .switcher button {
    white-space: nowrap; border: 1px solid #c5ced8; background: #fff;
    border-radius: 16px; padding: 5px 12px; font-size: 12px; color: #3a4452;
    flex: none;
  }
  .switcher button.on { background: #ffd866; color: #1f2329; border-color: #ffd866; font-weight: 700; }
  .citysel { flex: none; font-size: 12px; padding: 4px 6px; border-radius: 6px; border: none; background: #fff; color: #1f2329; max-width: 42%; }

  #app { flex: 1; display: flex; min-height: 0; }
  #left {
    width: 42%; border-right: 1px solid #d9dee5; background: #fff;
    overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch;
  }
  #right {
    flex: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch;
  }
  .pane-title {
    font-size: 12px; color: #7a8699; margin: 0 0 8px;
    position: sticky; top: 0; background: #fff; padding-bottom: 4px;
  }
  .opt {
    display: block; width: 100%; text-align: left;
    border: 1px solid #d9dee5; background: #fff; border-radius: 10px;
    padding: 11px 12px; margin-bottom: 8px; font-size: 14px; line-height: 1.35;
    color: #1f2329; position: relative;
  }
  .opt.sel { border-color: #1f6feb; background: #eaf2ff; box-shadow: 0 0 0 2px rgba(31,111,235,.25); }
  .opt.used { opacity: .45; }
  .opt .tag { position: absolute; top: 8px; right: 10px; font-size: 11px; color: #1f6feb; }

  #thead { margin-bottom: 10px; }
  .phead { width: 100%; border-collapse: collapse; background: #fff; }
  .phead td {
    border: 1px solid #3a4452; padding: 2px 1px; font-size: 10px;
    line-height: 1.25; text-align: center; color: #1f2329; height: 20px;
  }
  .phead .dt { font-size: 8.5px; color: #4a5568; }

  .step {
    display: flex; align-items: stretch; background: #fff;
    border: 1px solid #e3e8ef; border-radius: 10px; margin-bottom: 8px; overflow: hidden;
  }
  .step .seq {
    width: 26px; flex: none; display: flex; align-items: center; justify-content: center;
    background: #f0f3f7; color: #5a6573; font-size: 12px; font-weight: 600;
  }
  .step .body { flex: 1; padding: 11px 12px; font-size: 14px; line-height: 1.4; display: flex; align-items: center; }
  .step.blank .body { min-height: 46px; }
  .step .blankbox {
    width: 100%; border: 2px dashed #c5ced8; border-radius: 8px;
    padding: 8px; color: #9aa4b2; text-align: center; font-size: 13px;
  }
  .step.filled .blankbox { border-style: solid; border-color: #1f6feb; color: #1f2329; background: #eaf2ff; font-weight: 600; }
  .step.ok .blankbox { border-color: #1aab5b; background: #e8f8ef; color: #0f7a3d; }
  .step.bad .blankbox { border-color: #e5484d; background: #fdeced; color: #c5221f; }

  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
    z-index: 50; align-items: center; justify-content: center; padding: 20px;
    padding-top: env(safe-area-inset-top);
  }
  .mask.show { display: flex; }
  .dlg { background: #fff; border-radius: 14px; padding: 18px; max-width: 340px; width: 100%; }
  .dlg h3 { margin: 0 0 8px; font-size: 17px; }
  .dlg .ok { color: #1aab5b; } .dlg .bad { color: #e5484d; }
  .dlg pre { white-space: pre-wrap; word-break: break-all; font-size: 13px; line-height: 1.5; color: #4a5568; max-height: 56vh; overflow: auto; margin: 0; }
  .dlg button { margin-top: 14px; width: 100%; border: none; background: #1f6feb; color: #fff; border-radius: 10px; padding: 11px; font-size: 15px; font-weight: 600; }
</style>
