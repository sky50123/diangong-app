<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#c8c4bd;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-tap-highlight-color:transparent}
#bar{position:fixed;top:0;left:0;right:0;height:52px;z-index:45;display:flex;align-items:center;gap:6px;
  padding:0 10px;background:#ded9d0;border-bottom:1px solid #b3aea4}
#bar .tt{font-weight:900;color:#a8322a;letter-spacing:1px;font-size:14px;line-height:1.24;white-space:nowrap}
#bar .tt2{display:block;font-size:11px;letter-spacing:1px;opacity:.92;font-weight:700}
#bar .sp{flex:1}
#bar button{border:1px solid #a9a49a;background:#f2efe9;color:#3a3833;border-radius:4px;
  padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;line-height:1}
#bar button:active{background:#e2ded5}
#stage{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#c8c4bd}
#svg{width:100%;height:100%;display:block;touch-action:manipulation}
.bar{filter:drop-shadow(0 0 2px #f1c40f) drop-shadow(0 0 5px #f1c40f)}
.bar.g{filter:drop-shadow(0 0 2px #2ecc71) drop-shadow(0 0 5px #2ecc71)}
.flow{animation:hvflow 2.4s linear infinite}
@keyframes hvflow{0%,100%{opacity:.78}50%{opacity:1}}
.hit{fill:transparent;cursor:pointer}
#log{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:56%;background:#f2efe9;
  border-top:1px solid #b3aea4;border-radius:10px 10px 0 0;transform:translateY(102%);
  transition:transform .22s ease;display:flex;flex-direction:column}
#log.on{transform:translateY(0)}
#log h4{font-size:13px;color:#33312c;padding:12px 14px 8px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid #ddd8cf}
#log h4 b{margin-left:auto;font-weight:600;color:#8d887e;font-size:11px}
#logbody{overflow:auto;padding:8px 14px 16px;font-size:12px;line-height:1.9;color:#4a473f}
#logbody .it{display:flex;gap:8px}
#logbody .it i{font-style:normal;color:#9b958a;flex:none;font-variant-numeric:tabular-nums}
#logbody .em{color:#9b958a}
#logbody .on{color:#9a6b00}
#logbody .off{color:#6f6b62}
</style>
