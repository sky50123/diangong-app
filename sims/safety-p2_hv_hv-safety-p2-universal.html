<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>高压科目二 · 安全隐患辨识（通版）</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1c1f26; color: #f2f3f5;
    -webkit-text-size-adjust: 100% !important; text-size-adjust: 100% !important; }
  #app { display: flex; flex-direction: column; height: 100%; }

  header { flex: 0 0 auto; padding: 8px 10px; background: #262a33; border-bottom: 1px solid #333; }
  .topbar { display: flex; align-items: center; gap: 8px; }
  .topbar h1 { font-size: 15px; margin: 0; flex: 1; font-weight: 600; }
  #siteBadge { font-size: 11px; color: #ffd56b; background: #3a3320; border: 1px solid #5a4d20;
    border-radius: 999px; padding: 2px 9px; white-space: nowrap; max-width: 46%; }
  #packErr { display: none; margin-top: 8px; background: #4a1c1c; border: 1px solid #a33;
    color: #ffd7d7; font-size: 11px; line-height: 1.5; padding: 7px 9px; border-radius: 8px; }
  #packErr.show { display: block; }
  #packErr b { color: #ff9b9b; }
  .tabs { display: flex; gap: 6px; margin-top: 8px; }
  .tab { flex: 1; text-align: center; padding: 7px 0; font-size: 13px; border-radius: 8px;
    background: #333845; color: #c9cdd4; user-select: none; }
  .tab.on { background: #c0392b; color: #fff; font-weight: 700; }

  #viewport { flex: 1 1 auto; position: relative; overflow: hidden;
    background: #15171c; touch-action: none; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #pic { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #marks { position: absolute; inset: 0; }

  /* 已挂的牌（小挂签量级：宽30px/字7.5px，禁止浏览器字体放大撑长） */
  /* 挂牌：竖长条（真实安全牌形态）。宽度固定，字多则自动换行 + 缩小字号，
     绝不用 overflow 裁切——长牌必须完整可读。 */
  .placed { position: absolute; transform: translate(-50%, -50%);
    width: 34px; pointer-events: auto; }
  .placed .mini { cursor: pointer; display: block; width: 34px; }
  .placed .plate { width: 34px; max-width: none; max-height: none; overflow: visible;
    text-size-adjust: none !important; -webkit-text-size-adjust: none !important;
    padding: 2px 2px 3px; border-width: 1px; }
  .placed .plate::before { width: 3px; height: 3px; top: -3px; }
  .placed .plate .lab { font-size: 4.6px !important; line-height: 1.2;
    -webkit-text-size-adjust: none !important; text-size-adjust: none !important;
    word-break: break-all; text-align: center; }
  /* 长牌：更小字号保证完整显示（15 字 ÷ 34px 宽 ≈ 每行 6 字 → 3 行） */
  .placed.long .plate .lab { font-size: 3.8px !important; }
  .placed.xlong .plate .lab { font-size: 3.3px !important; }

  /* ---- 隐患点编号 + 答案卡（对齐低压体验版；不透明深底亮字，绝不糊照片） ---- */
  .guide { position:absolute; width:0; height:0; z-index:18; pointer-events:none; }
  .guide .num { position:absolute; left:14px; top:-30px; width:24px; height:24px; border-radius:50%;
    background:rgba(192,57,43,.96); color:#fff; font-size:13px; font-weight:800; line-height:24px; text-align:center;
    box-shadow:0 1px 5px rgba(0,0,0,.55); border:1.5px solid #fff; }
  .guide.ok .num { background:#1e9e4a; }
  .guide.no .num { background:#d23b3b; }
  .guide .ans { position:absolute; left:20px; top:50%; transform:translateY(-50%); width:118px; box-sizing:border-box;
    background:rgba(15,18,24,.96); border:1px solid #d23b3b; border-radius:6px; padding:4px 6px;
    font-size:10px; line-height:1.3; color:#ffd7d7; text-align:left; white-space:normal; }
  .guide .ans b { display:block; font-size:9px; font-weight:700; margin-bottom:2px; color:#ff9b9b; }
  .guide.flip .num { left:auto; right:14px; }
  .guide.flip .ans { left:auto; right:20px; transform:translateY(-50%); }
  /* 调试拖点：数字点可拖，旁印正确答案，一眼对应问题点 */
  .guide.debug { pointer-events:auto; cursor:grab; }
  .guide.debug .num { pointer-events:auto; cursor:grab; border:2px dashed #ffd56b; box-shadow:0 0 6px rgba(255,213,107,.5); }
  .guide.debug:active { cursor:grabbing; }
  .guide.debug .ans { left:44px; right:auto; pointer-events:none; border-color:#ffd56b; color:#eef0f3; background:rgba(15,18,24,.96); }
  .guide.debug.flip .ans { left:auto; right:44px; }   /* 右半屏的点答案翻左侧，仍避开数字圆圈 */
  .guide.debug .ans b { color:#ffd56b; }
  /* 交卷复盘：正确答案直接标在照片数字点旁 */
  .guide.reveal .ans { left:44px; right:auto; background:rgba(12,15,20,.98); color:#f4f6fa;
    font-size:11px; line-height:1.35; border-width:1.5px; box-shadow:0 2px 8px rgba(0,0,0,.6); }
  .guide.reveal.flip .ans { left:auto; right:44px; }
  .guide.reveal .ans b { font-size:10px; }
  .guide.reveal.ansok .ans { border-color:#37d67a; }
  .guide.reveal.ansok .ans b { color:#7be8a8; }
  .guide.reveal.ansno .ans { border-color:#ffd56b; }
  .guide.reveal.ansno .ans b { color:#ffd56b; }
  .guide.reveal .num { pointer-events:auto; cursor:pointer; }
  .guide.reveal.focus { z-index:30; }
  .guide.reveal.focus .ans { opacity:1; }
  .guide.reveal.dim .ans { opacity:.1; }
  /* 拖动/点击聚焦：其余答案淡出，解决密集点重叠 */
  .guide.dim .ans { opacity:.12; }
  .guide.dragging { z-index:30; }
  .guide.dragging .ans { opacity:1; }
  .guide .lc { position:absolute; left:50%; top:27px; transform:translateX(-50%);
    font-size:10px; color:#ffd56b; background:rgba(0,0,0,.7); padding:1px 4px; border-radius:4px;
    white-space:nowrap; pointer-events:none; }

  /* 牌子视觉（红底白字 + 白内框 + 挂孔，无编号圈） */
  .plate { position: relative; background: #c0392b; color: #fff; border-radius: 3px;
    border: 1.5px solid #fff; box-shadow: 0 0 0 1px #9c2b20, 0 2px 5px rgba(0,0,0,.4);
    padding: 3px 6px 4px; white-space: normal; }
  .plate::before { content: ""; position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #9c2b20; }
  .plate .lab { display: block; width: 100%; font-size: 10px; line-height: 1.25;
    -webkit-text-size-adjust: none; text-size-adjust: none; }

  /* 左侧标志牌栏：贴左边缘一根竖标签，点开滑出牌栏，从栏里把牌子拖到图上 */
  #railTab { position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 52;
    writing-mode: vertical-rl; letter-spacing: 4px;
    padding: 16px 8px; background: #c0392b; color: #fff; font-size: 13px; font-weight: 700;
    border: none; border-radius: 0 10px 10px 0; box-shadow: 2px 2px 8px rgba(0,0,0,.45); }
  #railTab:active { filter: brightness(.9); }
  #railBadge { position: absolute; top: 4px; right: 0; transform: translateX(50%);
    background: #ffd56b; color: #7a221a; font-size: 10px; font-weight: 800;
    min-width: 16px; line-height: 16px; border-radius: 8px; padding: 0 4px;
    writing-mode: horizontal-tb; letter-spacing: 0; }
  #railMask { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 52; display: none; }
  #railMask.show { display: block; }
  #rail { position: fixed; left: 0; top: 0; bottom: 0; width: clamp(178px, 47vw, 200px); z-index: 53;
    background: #262a33; border-right: 1px solid #3d4350;
    padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
    transform: translateX(-105%); transition: transform .22s ease; overflow-y: auto; }
  #rail.show { transform: translateX(0); }
  #rail .rhead { display: flex; align-items: flex-start; gap: 8px; margin: 0 2px 10px; }
  #rail .rhead p { flex: 1; margin: 0; font-size: 11px; color: #9aa0aa; line-height: 1.4; }
  #railClose { border: none; background: #333845; color: #c9cdd4; font-size: 12px;
    padding: 6px 12px; border-radius: 7px; flex: 0 0 auto; }
  #railGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 8px;
    justify-items: center; align-items: start; touch-action: none; }
  .pcell { cursor: grab; touch-action: none; }
  .pcell.used { opacity: .28; pointer-events: none; }
  /* 窄牌：文字折 3~4 行，栏宽减半 */
  .pcell .plate { width: 74px; max-width: 100%; min-height: 0; text-align: center;
    padding: 4px 3px 5px; }
  .pcell .plate .lab { font-size: 9px; line-height: 1.25; }

  /* 拖拽幽灵（跟手指走） */
  #ghost { position: fixed; left: 0; top: 0; transform: translate(-50%, -50%); z-index: 70;
    pointer-events: none; display: none; width: 34px; opacity: .95; }
  #ghost .plate { text-size-adjust: none !important; -webkit-text-size-adjust: none !important;
    padding: 2px 2px 3px; border-width: 1px; }
  #ghost .plate .lab { font-size: 7px !important; line-height: 1.1;
    -webkit-text-size-adjust: none !important; text-size-adjust: none !important; }

  /* 拖拽时最近热区高亮（长方形，形似标志牌） */
  .hot { position: absolute; transform: translate(-50%, -50%); border-radius: 3px;
    border: 2px dashed #ffd56b; background: rgba(255,213,107,.18); pointer-events: none;
    display: none; box-sizing: border-box; }
  .hot.show { display: block; }

  /* 放置模式横幅（选牌后出现在图上方） */
  #banner { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 20;
    display: none; align-items: center; gap: 8px;
    background: rgba(20,24,32,.92); border: 1px solid #5a4d20; border-radius: 10px;
    padding: 8px 10px; }
  #banner.show { display: flex; }
  #banner .btxt { flex: 1; font-size: 12px; line-height: 1.4; color: #ffd56b; }
  #banner .btxt b { color: #fff; }
  #bannerCancel { border: none; background: #333845; color: #c9cdd4; font-size: 12px;
    padding: 6px 10px; border-radius: 7px; flex: 0 0 auto; }

  /* 落点提示 toast */
  #toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 25; background: rgba(0,0,0,.82); color: #fff; font-size: 12px;
    padding: 7px 12px; border-radius: 8px; display: none; white-space: nowrap; }

  /* HUD */
  #hud { flex: 0 0 auto; display: flex; gap: 8px; padding: 8px 10px; background: #262a33; border-top: 1px solid #333; }
  .btn { flex: 1; padding: 11px 0; font-size: 14px; border: none; border-radius: 9px; font-weight: 700;
    background: #3a4150; color: #fff; }
  .btn.primary { background: #c0392b; }
  .btn:active { filter: brightness(.9); }

  /* 结果浮层 */
  #result { position: fixed; inset: 0; background: rgba(10,12,16,.86); z-index: 60;
    display: none; align-items: center; justify-content: center; padding: 16px; }
  #result .box { width: 100%; max-width: 460px; background: #262a33; border-radius: 14px; padding: 18px; }
  #result h2 { margin: 0 0 6px; font-size: 19px; }
  #result .score { font-size: 34px; font-weight: 800; color: #ffd56b; margin: 6px 0; }
  #result .list { max-height: 44vh; overflow-y: auto; margin: 10px 0; }
  #result .row { font-size: 13px; padding: 7px 9px; border-radius: 8px; margin-bottom: 6px; background: #1f232b; }
  #result .row.ok { border-left: 4px solid #1e9e4a; }
  #result .row.no { border-left: 4px solid #d23b3b; }
  #result .row b { color: #ffd56b; }
  #result .row .tip { display: block; font-size: 12px; color: #cfd6e0; margin-top: 4px; line-height: 1.4; }
  #result .acts { display: flex; gap: 8px; margin-top: 8px; }
  #result .acts .btn { font-size: 13px; padding: 10px 0; }
  /* ===== 考前个人穿戴（硬门槛：全部穿戴合格才能进场景） ===== */
  #ppeGate { position: fixed; inset: 0; z-index: 80; background: #14171d;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 18px 14px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; }
  #ppeGate.show { display: flex; }
  #ppeGate h2 { margin: 0 0 4px; font-size: 19px; }
  #ppeGate .sub { font-size: 12px; color: #9aa0aa; margin: 0 0 14px; text-align: center; line-height: 1.6; }
  #ppeGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 10px; width: 100%; max-width: 420px; }
  .ppe-card { background: #262a33; border: 1px solid #3d4350; border-radius: 12px;
    padding: 10px 8px; text-align: center; position: relative; user-select: none; }
  .ppe-card:active { filter: brightness(1.15); }
  .ppe-card img { width: auto; height: auto; max-width: 100%; max-height: 96px; object-fit: contain; display: block; margin: 0 auto 6px; background: #f4f5f7; border-radius: 10px; padding: 8px; box-sizing: border-box; }
  .ppe-card .nm { font-size: 13px; font-weight: 700; }
  .ppe-card .st { font-size: 11px; color: #9aa0aa; margin-top: 3px; }
  .ppe-card.done { border-color: #1e9e4a; }
  .ppe-card.done .st { color: #4cd97b; font-weight: 700; }
  .ppe-card.done::after { content: "✓"; position: absolute; top: 6px; right: 8px;
    width: 20px; height: 20px; line-height: 20px; border-radius: 50%;
    background: #1e9e4a; color: #fff; font-size: 13px; font-weight: 800; }
  #ppeFoot { display: flex; gap: 10px; width: 100%; max-width: 420px; margin-top: 14px; }
  #ppeEnter:disabled { opacity: .45; }
  /* 穿戴前检查浮层（气密性试验 / 外观·合格证·有效期） */
  #ppeCheck { position: fixed; inset: 0; z-index: 85; background: rgba(10,12,16,.92);
    display: none; align-items: center; justify-content: center; padding: 16px; }
  #ppeCheck.show { display: flex; }
  #ppeCheck .box { width: 100%; max-width: 400px; background: #262a33; border-radius: 14px; padding: 16px; }
  #pcImg { width: auto; height: auto; max-width: 100%; max-height: 170px; object-fit: contain; display: block; margin: 0 auto 10px; background: #f4f5f7; border-radius: 12px; padding: 12px; box-sizing: border-box; }
  #pcTitle { text-align: center; font-size: 16px; font-weight: 800; margin-bottom: 2px; }
  #pcSub { text-align: center; font-size: 11px; color: #9aa0aa; margin-bottom: 12px; }
  .ppe-step { display: flex; align-items: center; gap: 10px; width: 100%;
    background: #1f232b; border: 1px solid #3d4350; border-radius: 10px;
    padding: 12px; margin-bottom: 8px; color: #f2f3f5; font-size: 13px; text-align: left; }
  .ppe-step:active { filter: brightness(1.2); }
  .ppe-step .tick { flex: 0 0 auto; width: 22px; height: 22px; line-height: 22px; border-radius: 50%;
    background: #333845; color: #9aa0aa; text-align: center; font-size: 13px; font-weight: 800; }
  .ppe-step.done { border-color: #1e9e4a; }
  .ppe-step.done .tick { background: #1e9e4a; color: #fff; }
  #pcActs { display: flex; gap: 10px; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="topbar">
      <h1 id="title">场景一</h1>
      <select id="siteBadge"><option>考点</option></select>
    </div>
    <div id="packErr"></div>
    <div class="tabs" id="tabs"></div>
  </header>

  <div id="viewport">
    <div id="stage">
      <img id="pic" alt="">
      <div id="marks"></div>
    </div>
    <div id="banner"><div class="btxt" id="bannerTxt"></div><button id="bannerCancel">取消</button></div>
    <div id="toast"></div>
  </div>

  <div id="hud">
    <button class="btn" id="clearBtn">清除挂牌</button>
    <button class="btn primary" id="submitBtn">交卷判分</button>
  </div>
</div>

<button id="railTab">标志牌栏<span id="railBadge">0</span></button>
<div id="railMask"></div>
<div id="rail">
  <div class="rhead"><p>按住一块牌子<b>拖到图上隐患位置松手</b>即可挂上（靠近正确位置会自动吸附）；也可以轻点选牌后再点图放置。图上已挂的牌点一下摘下。</p><button id="railClose">收起</button></div>
  <div id="railGrid"></div>
</div>
<div id="ghost"></div>

<div id="result">
  <div class="box">
    <h2 id="rTitle">判分结果</h2>
    <div class="score" id="rScore">0 / 0</div>
    <div class="list" id="rList"></div>
    <div class="acts">
      <button class="btn" id="rRetry">重做本题</button>
      <button class="btn" id="rClose">看现场标注</button>
      <button class="btn primary" id="rNext">下一题</button>
    </div>
  </div>
</div>


<!-- 考前个人穿戴（硬门槛，对应评分表「考前准备：任意一项未穿戴→终止考试」） -->
<div id="ppeGate">
  <h2>考前准备 · 个人穿戴</h2>
  <p class="sub">请逐项检查并穿戴下列安全防护用品，全部完成后方可进入考场。</p>
  <div id="ppeGrid"></div>
  <div id="ppeFoot">
    <button class="btn" id="ppeRedo">重新穿戴</button>
    <button class="btn primary" id="ppeEnter" disabled>进入考场</button>
  </div>
</div>
<div id="ppeCheck">
  <div class="box">
    <img id="pcImg" alt="">
    <div id="pcTitle"></div>
    <div id="pcSub"></div>
    <div id="pcSteps"></div>
    <div id="pcActs">
      <button class="btn" id="pcBack">返回</button>
      <button class="btn primary" id="pcWear" disabled>穿戴</button>
    </div>
