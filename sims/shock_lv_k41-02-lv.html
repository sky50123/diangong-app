<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K41-02 低压触电事故 现场应急处置 · 实景复刻</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#20242a;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;z-index:10;background:#213a5c;color:#fff;padding:8px 12px 7px}
#bar h1{margin:0;font-size:15px;font-weight:800}
#bar p{margin:2px 0 0;font-size:11px;opacity:.85}
#top{position:fixed;top:52px;left:0;right:0;z-index:10}
/* 2026-10-05：提示条与顶栏统一到同一套蓝灰家族（沿用高压页定版配色） */
#hint{background:#eef2f7;color:#213a5c;font-size:12.5px;font-weight:700;padding:7px 12px;border-bottom:1px solid #cfdcea;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#hint .bno{background:#2d5a8f;color:#fff;border-radius:5px;padding:1px 7px;font-size:11px;flex:0 0 auto}
.hbtn{border:0;background:#1f7a4d;color:#fff;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer;flex:0 0 auto}
/* 底部只留一条功能键横排条（约 56px），与高压页一致 */
#cv{position:fixed;left:0;right:0;top:0;bottom:56px;width:100%;height:calc(100% - 56px);touch-action:none;display:block}
/* 场景 1080x760 是宽扁比例，竖屏手机按宽度装下后上下必然留白；
   这块留白承载「实时步骤面板」：处置步骤完成情况 + 实时得分。 */
#steps{position:absolute;left:0;right:0;bottom:56px;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0 8px 4px;max-height:40%;overflow:hidden;pointer-events:none}
#steps .cap{font-size:10.5px;color:#6f7883;letter-spacing:1px;margin-bottom:3px;flex:0 0 auto}
#sList{width:100%;max-width:330px;margin:0;padding:0;list-style:none;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:3px 4px;align-content:flex-end}
#sList li{font-size:11px;line-height:1.4;color:#8b939e;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);border-radius:5px;padding:0 3px;
  text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-height:720px){
  #sList{grid-template-columns:repeat(2,minmax(0,1fr));max-width:250px}
  #sList li{font-size:10px;line-height:1.35}
}
#sList li.done{color:#7fd6a8;border-color:rgba(46,160,90,.5);background:rgba(46,160,90,.13)}
#sList li.cur{color:#9cc6f7;border-color:#3d7fd6;background:rgba(61,127,214,.16);font-weight:800}
#sList li.score{grid-column:1 / -1;color:#ffd98a;border-color:rgba(201,144,26,.55);
  background:rgba(201,144,26,.14);font-weight:800;white-space:normal}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:13;display:flex;
  flex-direction:row;justify-content:center;align-items:center;gap:10px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(33,58,92,.97);box-shadow:0 -2px 10px rgba(0,0,0,.4)}
.fbtn{border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px 18px;font-size:13px;font-weight:800;
  color:#e8eef6;cursor:pointer;background:rgba(255,255,255,.10);white-space:nowrap}
.fbtn:active{background:rgba(255,255,255,.24)}
#timeBox{position:absolute;right:12px;top:11px;background:rgba(0,0,0,.3);border-radius:6px;padding:3px 9px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
#verify{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#fff;border-top:2px solid #1f4fbf;padding:12px 14px 16px;display:none;max-height:46%;overflow:auto}
#verify h3{margin:0 0 8px;font-size:14px;color:#1f4fbf}
.vrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid #eef1f4}
.vrow span:first-child{flex:1 1 auto}
.vrow span:last-child{flex:0 0 auto}
.vok{color:#1f7a4d;font-weight:800}.vbad{color:#c0392b;font-weight:800}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
</style>
</head>
